<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shorts</title>
<link rel="preconnect" href="https://www.youtube.com">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{color:#fff;font-family:-apple-system,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.card{height:82vh;aspect-ratio:9/16;border-radius:14px;overflow:hidden;position:relative;transition:height .2s ease;flex-shrink:0;background:#000;cursor:pointer;pointer-events:none;}
body.ready .card{pointer-events:auto}
body.menu-active .card{height:48vh}
#feed{position:absolute;inset:0;transition:transform .32s cubic-bezier(.4,0,.2,1);}
.reel{position:absolute;left:0;width:100%;height:100%;background:#000}
.reel iframe{outline:none;width:100%;height:100%;border:none;position:absolute;inset:0;}
.yt-touch{position:absolute;inset:0;z-index:2;touch-action:none;}
.vid-info{position:absolute;left:0;right:0;bottom:0;padding:48px 12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none;z-index:3;transition:opacity .2s;}
body.menu-active .vid-info{opacity:0}
.vid-info-user{font-size:13px;font-weight:700;margin-bottom:3px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vid-info-cap{font-size:12px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-info-stats{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;display:flex;gap:10px}
.vid-info-stats span{display:flex;align-items:center;gap:3px}
.play-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3);pointer-events:none;z-index:5;}
body.menu-active .play-overlay{display:flex}
.play-circle{width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;}
.play-circle svg{width:20px;height:20px;fill:rgba(255,255,255,.9);margin-left:2px}
.menu-info{display:none;flex-direction:column;align-items:flex-start;width:auto;max-width:80%;padding:0 4px}
body.menu-active .menu-info{display:flex}
.menu-user-row{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.menu-avatar{width:22px;height:22px;border-radius:50%;background:#444;border:1px solid #666;overflow:hidden;flex-shrink:0}
.menu-avatar img{width:100%;height:100%;object-fit:cover}
.menu-cap{font-size:12px;color:#ccc;margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-stats{font-size:11px;color:#aaa;margin-top:4px;display:flex;gap:12px}
.menu-stats span{display:flex;align-items:center;gap:3px}
.menu-actions{display:none;gap:18px;padding:10px 24px;background:rgba(50,50,50,.8);border-radius:40px}
body.menu-active .menu-actions{display:flex}
.action-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.action-btn svg{width:24px;height:24px;fill:#fff;opacity:.85;transition:all .15s}
.action-btn.liked svg{fill:#fe2c55;opacity:1}
.action-btn.saved svg{fill:#ffe135;opacity:1}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(60,60,60,.85);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
.loader.show{opacity:1}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.splash{position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:16px;}
.splash-icon{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px;padding-left:4px}
.splash-text{color:#fff;font-size:15px;letter-spacing:.05em}
.more-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:90%;max-width:360px;background:#1a1a1a;border-radius:18px 18px 0 0;z-index:400;padding:12px 0 24px;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.more-sheet.open{transform:translateX(-50%) translateY(0)}
.more-sheet-handle{width:36px;height:4px;border-radius:2px;background:#555;margin:0 auto 16px}
.more-sheet-title{font-size:11px;color:#666;padding:0 20px 8px;text-transform:uppercase;letter-spacing:.08em}
.more-row{display:flex;align-items:center;gap:14px;padding:13px 20px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.more-row:active{background:rgba(255,255,255,.06)}
.more-row-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.more-row-icon svg{width:18px;height:18px;fill:#fff}
.more-row-label{font-size:14px}
.more-sheet-cancel{margin:8px 20px 0;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);text-align:center;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.more-backdrop{position:fixed;inset:0;z-index:399;background:rgba(0,0,0,.5);display:none}
.more-backdrop.open{display:block}
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="splash-icon">▶</div>
  <div class="splash-text">Tap to Start</div>
</div>
<div class="stage">
  <div class="card" id="card">
    <div id="feed"></div>
    <div class="vid-info" id="vidInfo">
      <div class="vid-info-user" id="vidUser"></div>
      <div class="vid-info-cap" id="vidCap"></div>
      <div class="vid-info-stats" id="vidStats"></div>
    </div>
    <div class="play-overlay"><div class="play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div></div>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>
  <div class="menu-info" id="menuInfo">
    <div class="menu-user-row">
      <div class="menu-avatar" id="menuAvatar"></div>
      <span id="menuUser">@user</span>
    </div>
    <div class="menu-cap" id="menuCap"></div>
    <div class="menu-stats" id="menuStats"></div>
  </div>
  <div class="menu-actions" id="menuActions">
    <div class="action-btn" id="btnLike" tabindex="0"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <div class="action-btn" id="btnShare" tabindex="0"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    <div class="action-btn" id="btnSave" tabindex="0"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="action-btn" id="btnMore" tabindex="0"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="more-backdrop" id="moreBackdrop"></div>
<div class="more-sheet" id="moreSheet">
  <div class="more-sheet-handle"></div>
  <div class="more-sheet-title">Options</div>
  <div class="more-row" id="moreNext">
    <div class="more-row-icon"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></div>
    <div class="more-row-label">Skip to Next Video</div>
  </div>
  <div class="more-row" id="moreCopyLink">
    <div class="more-row-icon"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></div>
    <div class="more-row-label">Copy Link</div>
  </div>
  <div class="more-row" id="moreNotInterested">
    <div class="more-row-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
    <div class="more-row-label">Not Interested</div>
  </div>
  <div class="more-sheet-cancel" id="moreCancel">Cancel</div>
</div>
<script>
let vids=[],idx=0,loading=false,menuOpen=false;
const seenIds=new Set(),likedIds=new Set(),savedIds=new Set();
let loadPending=false,userTouched=false;

const card=document.getElementById('card');
const feed=document.getElementById('feed');
const toastEl=document.getElementById('toast');
const loader=document.getElementById('loader');
const btnLike=document.getElementById('btnLike');
const btnShare=document.getElementById('btnShare');
const btnSave=document.getElementById('btnSave');
const btnMore=document.getElementById('btnMore');

function fmt(n){if(!n)return'0';return n>1e6?(n/1e6).toFixed(1)+'M':n>1e3?(n/1e3).toFixed(1)+'K':String(n);}
let toastT=null;
function toast(msg){clearTimeout(toastT);toastEl.textContent=msg;toastEl.classList.add('show');toastT=setTimeout(()=>toastEl.classList.remove('show'),1600);}

function updateOverlay(d){
  document.getElementById('vidUser').textContent='@'+(d.author?.unique_id||'user');
  document.getElementById('vidCap').textContent=d.title||'';
  document.getElementById('vidStats').innerHTML='<span>❤️ '+fmt(d.digg_count)+'</span><span>↗️ '+fmt(d.share_count||0)+'</span>';
}

function openMenu(){
  if(!vids[idx]||menuOpen)return;
  loader.classList.remove('show');
  menuOpen=true;
  // Only YT supports postMessage pause
  if(!vids[idx]?._igReel){
    const iframe=document.querySelector('.reel.active iframe');
    if(iframe)iframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');
  }
  const d=vids[idx];
  document.getElementById('menuUser').textContent='@'+(d.author?.unique_id||'user');
  document.getElementById('menuCap').textContent=d.title||'';
  document.getElementById('menuAvatar').innerHTML=d.author?.avatar?'<img src="'+d.author.avatar+'">':'';
  document.getElementById('menuStats').innerHTML='<span>❤️ '+fmt(d.digg_count)+'</span><span>↗️ '+fmt(d.share_count||0)+'</span><span>💬 '+fmt(d.comment_count||0)+'</span>';
  btnLike.classList.toggle('liked',likedIds.has(d.aweme_id));
  btnSave.classList.toggle('saved',savedIds.has(d.aweme_id));
  document.body.classList.add('menu-active');
}
function closeMenu(){
  if(!menuOpen)return;
  menuOpen=false;
  document.body.classList.remove('menu-active');
  if(!vids[idx]?._igReel){
    const iframe=document.querySelector('.reel.active iframe');
    if(iframe)iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}','*');
  }
}

const moreSheet=document.getElementById('moreSheet');
const moreBackdrop=document.getElementById('moreBackdrop');
function openMore(){moreSheet.classList.add('open');moreBackdrop.classList.add('open');}
function closeMore(){moreSheet.classList.remove('open');moreBackdrop.classList.remove('open');}

btnLike.addEventListener('click',(e)=>{e.stopPropagation();if(!vids[idx])return;const id=vids[idx].aweme_id;if(likedIds.has(id)){likedIds.delete(id);btnLike.classList.remove('liked');toast('Removed like');}else{likedIds.add(id);btnLike.classList.add('liked');toast('Liked!');}});
btnShare.addEventListener('click',(e)=>{e.stopPropagation();if(!vids[idx])return;const d=vids[idx];const url=d._igReel?'https://www.instagram.com/reel/'+d.igReelId+'/':'https://www.youtube.com/shorts/'+(d.ytVideoId||'');if(navigator.share)navigator.share({title:d.title||'Reel',url}).catch(()=>{});else navigator.clipboard.writeText(url).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed'));});
btnSave.addEventListener('click',(e)=>{e.stopPropagation();if(!vids[idx])return;const id=vids[idx].aweme_id;if(savedIds.has(id)){savedIds.delete(id);btnSave.classList.remove('saved');toast('Unsaved');}else{savedIds.add(id);btnSave.classList.add('saved');toast('Saved!');}});
btnMore.addEventListener('click',(e)=>{e.stopPropagation();openMore();});
document.getElementById('moreCancel').addEventListener('click',closeMore);
document.getElementById('moreBackdrop').addEventListener('click',closeMore);
document.getElementById('moreNext').addEventListener('click',()=>{closeMore();closeMenu();show(idx+1,true,1);});
document.getElementById('moreCopyLink').addEventListener('click',()=>{closeMore();if(!vids[idx])return;const d=vids[idx];const url=d._igReel?'https://www.instagram.com/reel/'+d.igReelId+'/':'https://www.youtube.com/shorts/'+(d.ytVideoId||'');navigator.clipboard.writeText(url).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed'));});
document.getElementById('moreNotInterested').addEventListener('click',()=>{closeMore();closeMenu();if(vids[idx]){seenIds.add(vids[idx].aweme_id+'_skip');show(idx+1,true,1);toast('Got it — showing less like this');}});

const YT_KEYS=[
  'AIzaSyDz_P6WIbRBr31VO7fQX0UcP3tFSBlGEE0','AIzaSyDsL7qek4qkCjmyczIUArhK8krUq2QV3mo',
  'AIzaSyBKgt_-gM4Nnfkxj-6xz81tNHMydBLD0CQ','AIzaSyAxz8JgYT02TS12fcdIYVNqmhT_0OwA48Q',
  'AIzaSyDM_mZiXih02mMOCKEUgfrJhHU0RCO_W4Y','AIzaSyAAqJcN9TJiNpPSvvIX8IP2pDCbwrwbH68',
  'AIzaSyALpQ6mleh8v4SlVnk1V8nBZ2pTIUQAoLk','AIzaSyAGy9rR4lbNYMlRgQcluVUlCpuRFIWbnZk',
  'AIzaSyD1f3AnsJRrGmTTBWK_XsgwqLnDQv2mA00','AIzaSyB0cB1FlDb4Azzq2xh7_ENz2CvwpWJnJXg',
  'AIzaSyCjyaZibozhYOTolhznZ0zLz45mIqtOLaw','AIzaSyC9qC_Q3q-aDhVwfp4QOdIvecqQW04Mq3M',
  'AIzaSyDTIw26DvcDWRCGftd-c-_SdcllN0zvxE0','AIzaSyALn7in8kXrFCzC1VU51UqNFZ9YuLkwXNY',
  'AIzaSyB_3g7oRfcoKqQYqt7UPHwQNTt3BjLD4iw'
];
let ytKeyIdx=0,ytPageToken='';
const YT_QUERIES=['#shorts','funny shorts','comedy shorts','viral shorts','trending shorts'];
let ytQueryIdx=0;

function getYtKey(){return YT_KEYS[ytKeyIdx%YT_KEYS.length];}
function parseIsoDuration(iso){if(!iso)return 999;const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);if(!m)return 999;return(parseInt(m[1]||0)*3600)+(parseInt(m[2]||0)*60)+parseInt(m[3]||0);}

function fetchFast(url,opts={},ms=6000){const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),ms);return fetch(url,{...opts,signal:ctrl.signal}).finally(()=>clearTimeout(t));}

async function ytFetch(url){
  let tried=0;
  while(tried<YT_KEYS.length){
    const u=new URL(url);u.searchParams.set('key',getYtKey());
    try{
      const res=await fetchFast(u.toString());const data=await res.json();
      if(data.error){const reason=data.error?.errors?.[0]?.reason||'';if(data.error.code===403&&(reason==='quotaExceeded'||reason==='dailyLimitExceeded'||reason==='forbidden')){ytKeyIdx++;tried++;continue;}throw new Error('YT API: '+data.error.message);}
      return data;
    }catch(e){if(e.name==='AbortError'||String(e).includes('quota')||String(e).includes('403')){ytKeyIdx++;tried++;continue;}throw e;}
  }
  throw new Error('All YT keys exhausted');
}

// ── Instagram Reels seed list (public reels, shuffled each session) ──────────
const IG_REELS=[
  'DPU6MyYjf2j','DRgY-XUgbad','DSm9Pp-k_AI','DJOAnNwBJzi','DS_2fw8iF57',
  'DSzpX-okzug','DSwZC6skg6V','DSpEyfiEvIC','DTH9g2_jlDq','DSflUBrCEEj',
  'DSfHN8ko6bx','DScim2ckyey','DS4cqfbkuHj','DQWUMnJCgoq','DS-EpaoCWqi',
  'DGyDhY6it7M','DZulnWQgadw','DSflUBrCEEj','DRgY-XUgbad','DTH9g2_jlDq'
];
let igReelPos=0;
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}
shuffleArray(IG_REELS);

function addIGReel(reelId){
  const id='ig_'+reelId;
  if(seenIds.has(id))return;
  seenIds.add(id);
  vids.push({aweme_id:id,igReelId:reelId,_igReel:true,title:'Instagram Reel',author:{unique_id:'instagram',avatar:''},digg_count:0,share_count:0,comment_count:0});
  const reel=document.createElement('div');
  reel.className='reel';reel.style.top=(vids.length-1)*100+'%';
  reel.dataset.igId=reelId;reel.dataset.igReady='0';
  feed.appendChild(reel);
}


async function loadBatch(){
  if(loading){loadPending=true;return;}
  loading=true;
  try{
    // Interleave: 2 IG reels before each YT batch
    for(let i=0;i<2;i++){if(igReelPos<IG_REELS.length)addIGReel(IG_REELS[igReelPos++]);}
    const query=YT_QUERIES[ytQueryIdx%YT_QUERIES.length];ytQueryIdx++;
    const searchParams=new URLSearchParams({part:'snippet',q:query,type:'video',videoDuration:'short',videoEmbeddable:'true',maxResults:30,regionCode:'US',relevanceLanguage:'en',key:'PLACEHOLDER',...(ytPageToken?{pageToken:ytPageToken}:{})});
    const searchData=await ytFetch('https://www.googleapis.com/youtube/v3/search?'+searchParams);
    ytPageToken=searchData.nextPageToken||'';
    const candidates=searchData.items||[];
    const snippetMap={};candidates.forEach(v=>{snippetMap[v.id.videoId]=v.snippet;});
    const ids=candidates.map(v=>v.id.videoId).join(',');
    const detailData=await ytFetch('https://www.googleapis.com/youtube/v3/videos?'+new URLSearchParams({part:'contentDetails,statistics',id:ids,key:'PLACEHOLDER'}));
    const shorts=(detailData.items||[]).filter(v=>{const s=parseIsoDuration(v.contentDetails?.duration);return s>0&&s<=60;});
    for(const v of shorts){
      const id='yt_'+v.id;
      if(seenIds.has(id))continue;
      seenIds.add(id);
      const snippet=snippetMap[v.id]||{};
      vids.push({aweme_id:id,ytVideoId:v.id,title:snippet.title||'',author:{unique_id:snippet.channelTitle||'YouTuber',avatar:''},digg_count:parseInt(v.statistics?.likeCount||0),share_count:0,comment_count:parseInt(v.statistics?.commentCount||0),cover:snippet.thumbnails?.high?.url||''});
      const reel=document.createElement('div');
      reel.className='reel';reel.style.top=(vids.length-1)*100+'%';
      reel.dataset.ytId=v.id;reel.dataset.ytReady='0';
      if(snippet.thumbnails?.high?.url){const img=document.createElement('img');img.src=snippet.thumbnails.high.url;img.style.cssText='width:100%;height:100%;object-fit:cover;position:absolute;inset:0';reel.appendChild(img);}
      feed.appendChild(reel);
      // 1 IG reel after every 3 YT shorts
      if(igReelPos<IG_REELS.length&&vids.length%3===0)addIGReel(IG_REELS[igReelPos++]);
    }
  }catch(e){console.error('loadBatch error',e);}
  loading=false;
  if(loadPending){loadPending=false;loadBatch();}
}

async function show(i,animate=false,dir=1){
  closeMenu();
  if(i>=vids.length){loader.classList.add('show');await loadBatch();}
  if(vids.length===0)return;
  if(i>=vids.length)i=vids.length-1;
  if(i<0)i=0;
  idx=i;

  const reels=document.querySelectorAll('.reel');
  const target='translateY('+(-(idx*100))+'%)';
  if(animate){
    const from='translateY('+(-((idx-dir)*100))+'%)';
    feed.style.transition='none';feed.style.transform=from;
    feed.getBoundingClientRect();
    feed.style.transition='transform .32s cubic-bezier(.4,0,.2,1)';feed.style.transform=target;
  }else{feed.style.transition='none';feed.style.transform=target;}

  reels.forEach((r,n)=>{
    const isActive=n===idx;
    r.classList.toggle('active',isActive);
    if(isActive){
      loader.classList.add('show');
      if(r.dataset.igId){
        // ── Instagram Reel ───────────────────────────────────────────────
        if(r.dataset.igReady==='0'){
          const igId=r.dataset.igId;
          const iframe=document.createElement('iframe');
          iframe.src='https://www.instagram.com/reel/'+igId+'/embed/';
          iframe.allow='autoplay; fullscreen';iframe.setAttribute('allowfullscreen','');
          iframe.setAttribute('loading','eager');
          iframe.style.cssText='width:100%;height:100%;border:none;position:absolute;inset:0';
          r.appendChild(iframe);r.dataset.igReady='1';
          const overlay=document.createElement('div');
          overlay.className='yt-touch';
          let _sx=0,_sy=0;
          overlay.addEventListener('touchstart',e=>{_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;},{passive:true});
          overlay.addEventListener('touchend',e=>{
            const dy=e.changedTouches[0].clientY-_sy,dx=e.changedTouches[0].clientX-_sx;
            e.stopPropagation();
            if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)){closeMenu();if(dy>50)show(idx+1,true,1);else show(idx-1,true,-1);}
            else if(Math.abs(dx)<40&&Math.abs(dy)<40){if(!menuOpen)openMenu();else closeMenu();}
          },{passive:false});
          overlay.addEventListener('click',e=>{e.stopPropagation();});
          r.appendChild(overlay);
          iframe.addEventListener('load',()=>{if(r.classList.contains('active'))loader.classList.remove('show');},{once:true});
        }else{
          loader.classList.remove('show');
        }
      }else if(r.dataset.ytId){
        // ── YouTube Short ────────────────────────────────────────────────
        if(r.dataset.ytReady==='0'){
          const img=r.querySelector('img');if(img)img.remove();
          const ytId=r.dataset.ytId;
          const iframe=document.createElement('iframe');
          iframe.src='https://www.youtube.com/embed/'+ytId+'?autoplay=1&mute=0&loop=1&playlist='+ytId+'&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1';
          iframe.allow='autoplay; fullscreen';iframe.setAttribute('allowfullscreen','');
          iframe.setAttribute('loading','eager');
          iframe.style.cssText='width:100%;height:100%;border:none;position:absolute;inset:0';
          r.appendChild(iframe);r.dataset.ytReady='1';
          const overlay=document.createElement('div');
          overlay.className='yt-touch';
          let _sx=0,_sy=0;
          overlay.addEventListener('touchstart',e=>{_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;},{passive:true});
          overlay.addEventListener('touchend',e=>{
            const dy=e.changedTouches[0].clientY-_sy,dx=e.changedTouches[0].clientX-_sx;
            e.stopPropagation();
            if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)){closeMenu();if(dy>50)show(idx+1,true,1);else show(idx-1,true,-1);}
            else if(Math.abs(dx)<40&&Math.abs(dy)<40){if(!menuOpen)openMenu();else closeMenu();}
          },{passive:false});
          overlay.addEventListener('click',e=>{e.stopPropagation();});
          r.appendChild(overlay);
          iframe.addEventListener('load',()=>{if(r.classList.contains('active'))loader.classList.remove('show');},{once:true});
        }else{
          const iframe=r.querySelector('iframe');
          if(iframe)iframe.contentWindow?.postMessage('{"event":"command","func":"playVideo","args":""}','*');
          loader.classList.remove('show');
        }
      }
      updateOverlay(vids[n]);
      if(n>=vids.length-5)loadBatch();
    }else{
      // Pause YT iframes (IG embeds don't support postMessage)
      if(r.dataset.ytId&&r.dataset.ytReady==='1'){
        const iframe=r.querySelector('iframe');
        if(iframe)iframe.contentWindow?.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');
      }
    }
  });
}

// Prewarm YouTube and Instagram connections
(function prewarm(){
  const ytWarm=document.createElement('iframe');
  ytWarm.src='https://www.youtube.com/embed/?enablejsapi=1&autoplay=0&mute=1';
  ytWarm.allow='autoplay';
  ytWarm.style.cssText='position:fixed;width:1px;height:1px;top:-9999px;left:-9999px;border:none;pointer-events:none;opacity:0;';
  ytWarm.setAttribute('aria-hidden','true');
  document.body.appendChild(ytWarm);
  setTimeout(()=>{if(ytWarm.parentNode)ytWarm.parentNode.removeChild(ytWarm);},30000);
  const igWarm=document.createElement('iframe');
  igWarm.src='https://www.instagram.com/';
  igWarm.style.cssText='position:fixed;width:1px;height:1px;top:-9999px;left:-9999px;border:none;pointer-events:none;opacity:0;';
  igWarm.setAttribute('aria-hidden','true');
  document.body.appendChild(igWarm);
  setTimeout(()=>{if(igWarm.parentNode)igWarm.parentNode.removeChild(igWarm);},15000);
})();

document.getElementById('splash').addEventListener('click',async(e)=>{
  e.stopPropagation();
  userTouched=true;
  document.getElementById('splash').style.display='none';
  document.body.classList.add('ready');
  loader.classList.add('show');
  await loadBatch();
  await show(0);
},{once:true});

let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
  if(moreSheet.classList.contains('open'))return;
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  const isSwipe=Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx);
  if(menuOpen){if(isSwipe&&dy<-50)closeMenu();return;}
  if(isSwipe){closeMenu();if(dy>50)show(idx+1,true,1);else show(idx-1,true,-1);}
},{passive:true});

addEventListener('keydown',e=>{
  if(!userTouched)userTouched=true;
  if(e.key==='ArrowDown'){closeMenu();show(idx+1,true,1);return;}
  if(e.key==='ArrowUp'){closeMenu();show(idx-1,true,-1);return;}
  if(menuOpen){if(e.key==='Escape'||e.key==='Enter'){closeMenu();return;}return;}
  if(e.key==='Enter'){loader.classList.remove('show');openMenu();return;}
});
</script>
