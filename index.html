<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="YouTube Shorts for Meta Ray-Ban Display">
<meta name="mrbd-web-app-capable" content="yes">
<title>Shorts</title>
<link rel="preconnect" href="https://www.youtube.com">
<style>
/* === Official MRBD base === */
*{margin:0;padding:0;box-sizing:border-box}
body{width:600px;height:600px;overflow:hidden;background:#000;color:#fff;font-family:system-ui,sans-serif}

/* Official focusable */
.focusable{transition:all 150ms ease;border:2px solid transparent;outline:none;}
.focusable:focus{border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.4);}

/* Screens */
#screen-splash,#screen-main{position:fixed;inset:0;width:600px;height:600px;}
#screen-main{display:none}

/* Splash */
#screen-splash{background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.splash-icon{width:80px;height:80px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:32px;}
.splash-title{font-size:22px;font-weight:700;color:#fff}
.splash-sub{font-size:14px;color:#888}
#btnStart{padding:12px 32px;border-radius:24px;background:#fe2c55;color:#fff;font-size:16px;font-weight:700;cursor:pointer;min-height:88px;display:flex;align-items:center;justify-content:center;}

/* Main */
.card{position:absolute;top:0;left:50%;transform:translateX(-50%);height:520px;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:#111;}
body.menu-active .card{height:300px;top:0;}
#feed{position:absolute;inset:0;transition:transform .3s cubic-bezier(.4,0,.2,1);}
.reel{position:absolute;left:0;width:100%;height:100%;background:#000}
.reel iframe{width:100%;height:100%;border:none;position:absolute;inset:0;outline:none;}
.yt-touch{position:absolute;inset:0;z-index:2;}

.vid-info{position:absolute;bottom:0;left:0;right:0;padding:40px 12px 12px;background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none;z-index:3;}
body.menu-active .vid-info{display:none}
.vid-user{font-size:14px;font-weight:700;margin-bottom:2px}
.vid-cap{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-stats{font-size:11px;color:rgba(255,255,255,.6);margin-top:4px;display:flex;gap:12px}

.play-icon{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3);pointer-events:none;z-index:4;}
body.menu-active .play-icon{display:flex}
.play-circle{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-size:20px;padding-left:3px}

/* Menu */
.menu-wrap{position:absolute;bottom:0;left:0;right:0;display:none;flex-direction:column;align-items:center;gap:8px;padding:8px 0 12px;}
body.menu-active .menu-wrap{display:flex}
.menu-info-row{display:flex;align-items:center;gap:8px;max-width:90%}
.menu-av{width:28px;height:28px;border-radius:50%;background:#333;overflow:hidden;flex-shrink:0}
.menu-av img{width:100%;height:100%;object-fit:cover}
.menu-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-cap{font-size:11px;color:#aaa;max-width:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btns{display:flex;gap:12px;background:rgba(30,30,30,.9);padding:10px 20px;border-radius:40px;}
.mbtn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:52px;}
.mbtn svg{width:26px;height:26px;fill:#fff}
.mbtn.liked svg{fill:#fe2c55}
.mbtn.saved svg{fill:#ffe135}

/* Loader */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:10;opacity:0;transition:opacity .2s;pointer-events:none;}
.loader.show{opacity:1}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Toast */
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(40,40,40,.9);color:#fff;padding:8px 18px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}

/* More sheet */
.more-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none}
.more-back.open{display:block}
.more-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:560px;background:#1a1a1a;border-radius:16px 16px 0 0;z-index:51;padding:10px 0 20px;transition:transform .28s cubic-bezier(.4,0,.2,1)}
.more-sheet.open{transform:translateX(-50%) translateY(0)}
.more-handle{width:40px;height:4px;background:#444;border-radius:2px;margin:0 auto 12px}
.more-item{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;min-height:88px;}
.more-item-icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.more-item-icon svg{width:20px;height:20px;fill:#fff}
.more-item-label{font-size:15px}
.more-cancel{margin:6px 20px 0;padding:14px;border-radius:12px;background:rgba(255,255,255,.07);text-align:center;font-size:15px;cursor:pointer;min-height:52px;display:flex;align-items:center;justify-content:center;}

/* Profile */
.profile-overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);display:none;flex-direction:column;align-items:center;padding:20px;gap:10px;overflow:hidden;}
.profile-overlay.open{display:flex}
.prof-av{width:60px;height:60px;border-radius:50%;background:#333;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;border:2px solid #555;flex-shrink:0}
.prof-av img{width:100%;height:100%;object-fit:cover}
.prof-name{font-size:16px;font-weight:700}
.prof-handle{font-size:13px;color:#888}
.prof-close{padding:8px 28px;border-radius:20px;background:rgba(255,255,255,.12);font-size:13px;cursor:pointer;min-height:44px;display:flex;align-items:center;}
.prof-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;margin-top:4px}
.prof-thumb{aspect-ratio:9/16;background:#222;border-radius:3px;overflow:hidden;cursor:pointer;min-height:44px;}
.prof-thumb img{width:100%;height:100%;object-fit:cover}
.prof-msg{grid-column:1/-1;text-align:center;padding:20px;color:#555;font-size:12px}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="screen-splash">
  <div class="splash-icon">▶</div>
  <div class="splash-title">Shorts</div>
  <div class="splash-sub">YouTube Shorts for Ray-Ban Display</div>
  <div id="btnStart" class="focusable">Press Enter to Start</div>
</div>

<!-- MAIN SCREEN -->
<div id="screen-main">
  <div class="card" id="card">
    <div id="feed"></div>
    <div class="vid-info">
      <div class="vid-user" id="vidUser"></div>
      <div class="vid-cap" id="vidCap"></div>
      <div class="vid-stats" id="vidStats"></div>
    </div>
    <div class="play-icon"><div class="play-circle">▶</div></div>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>
  <div class="menu-wrap" id="menuWrap">
    <div class="menu-info-row">
      <div class="menu-av" id="menuAv"></div>
      <div class="menu-name" id="menuName"></div>
    </div>
    <div class="menu-cap" id="menuCap"></div>
    <div class="menu-btns">
      <div class="mbtn focusable" id="btnLike"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
      <div class="mbtn focusable" id="btnShare"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
      <div class="mbtn focusable" id="btnSave"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
      <div class="mbtn focusable" id="btnMore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- MORE SHEET -->
<div class="more-back" id="moreBack"></div>
<div class="more-sheet" id="moreSheet">
  <div class="more-handle"></div>
  <div class="more-item focusable" id="moreProfile">
    <div class="more-item-icon"><svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg></div>
    <div class="more-item-label">View Creator Profile</div>
  </div>
  <div class="more-item focusable" id="moreNext">
    <div class="more-item-icon"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2-8.14L11.03 12 8 14.14V9.86zM16 6h2v12h-2z"/></svg></div>
    <div class="more-item-label">Next Video</div>
  </div>
  <div class="more-item focusable" id="moreCopy">
    <div class="more-item-icon"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg></div>
    <div class="more-item-label">Copy Link</div>
  </div>
  <div class="more-item focusable" id="moreSkip">
    <div class="more-item-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg></div>
    <div class="more-item-label">Not Interested</div>
  </div>
  <div class="more-cancel focusable" id="moreCancel">Cancel</div>
</div>

<!-- PROFILE -->
<div class="profile-overlay" id="profileOverlay">
  <div class="prof-av" id="profAv">▶</div>
  <div class="prof-name" id="profName"></div>
  <div class="prof-handle" id="profHandle"></div>
  <div class="prof-close focusable" id="profClose">Close</div>
  <div class="prof-grid" id="profGrid"><div class="prof-msg">Loading...</div></div>
</div>

<script>
// ── Official MRBD focus management (exact from docs) ──────────────────────
function moveFocus(direction){
  var focusables=Array.from(document.querySelectorAll('.focusable:not([disabled]):not(.hidden)'));
  if(!focusables.length)return;
  var idx=focusables.indexOf(document.activeElement);
  if(idx===-1){focusables[0].focus();return;}
  var next=(direction==='up'||direction==='left')
    ?(idx>0?idx-1:focusables.length-1)
    :(idx<focusables.length-1?idx+1:0);
  focusables[next].focus();
  focusables[next].scrollIntoView({block:'nearest',behavior:'smooth'});
}

// ── Official MRBD keydown handler (exact from docs) ───────────────────────
document.addEventListener('keydown',function(e){
  switch(e.key){
    case 'ArrowUp':   moveFocus('up');   break;
    case 'ArrowDown': moveFocus('down'); break;
    case 'ArrowLeft': moveFocus('left'); break;
    case 'ArrowRight':moveFocus('right');break;
    case 'Enter':
      if(document.activeElement&&document.activeElement.classList.contains('focusable')){
        document.activeElement.click();
      }
      break;
    case 'Escape': handleEscape(); break;
    default: return;
  }
  e.preventDefault();
});

function handleEscape(){
  if(document.getElementById('profileOverlay').classList.contains('open')){closeProfile();return;}
  if(document.getElementById('moreSheet').classList.contains('open')){closeMore();return;}
  if(document.body.classList.contains('menu-active')){closeMenu();return;}
}

// ── State ─────────────────────────────────────────────────────────────────
var vids=[],idx=0,loading=false,menuOpen=false,moreOpen=false;
var seenIds=new Set(),likedIds=new Set(),savedIds=new Set();
var loadPending=false;

var loader=document.getElementById('loader');
var feed=document.getElementById('feed');
var btnLike=document.getElementById('btnLike');
var btnSave=document.getElementById('btnSave');

// ── Toast ─────────────────────────────────────────────────────────────────
var toastT;
function toast(msg){
  clearTimeout(toastT);
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  toastT=setTimeout(function(){t.classList.remove('show');},1800);
}

function fmt(n){if(!n)return'0';return n>1e6?(n/1e6).toFixed(1)+'M':n>1e3?(n/1e3).toFixed(1)+'K':String(n);}

// ── Menu ──────────────────────────────────────────────────────────────────
function openMenu(){
  if(!vids[idx]||menuOpen)return;
  loader.classList.remove('show');
  menuOpen=true;
  var iframe=document.querySelector('.reel.active iframe');
  if(iframe)iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');
  var d=vids[idx];
  document.getElementById('menuName').textContent='@'+(d.author.unique_id||'');
  document.getElementById('menuCap').textContent=d.title||'';
  var av=document.getElementById('menuAv');
  av.innerHTML=d.author.avatar?'<img src="'+d.author.avatar+'">':'';
  btnLike.classList.toggle('liked',likedIds.has(d.aweme_id));
  btnSave.classList.toggle('saved',savedIds.has(d.aweme_id));
  document.body.classList.add('menu-active');
  // Focus first menu button
  btnLike.focus();
}
function closeMenu(){
  if(!menuOpen)return;
  menuOpen=false;
  document.body.classList.remove('menu-active');
  var iframe=document.querySelector('.reel.active iframe');
  if(iframe)iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}','*');
}

// ── Button actions ────────────────────────────────────────────────────────
btnLike.addEventListener('click',function(){
  if(!vids[idx])return;var id=vids[idx].aweme_id;
  if(likedIds.has(id)){likedIds.delete(id);btnLike.classList.remove('liked');toast('Removed like');}
  else{likedIds.add(id);btnLike.classList.add('liked');toast('Liked!');}
});
document.getElementById('btnShare').addEventListener('click',function(){
  if(!vids[idx])return;
  var url='https://www.youtube.com/shorts/'+vids[idx].ytVideoId;
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied!');});
});
btnSave.addEventListener('click',function(){
  if(!vids[idx])return;var id=vids[idx].aweme_id;
  if(savedIds.has(id)){savedIds.delete(id);btnSave.classList.remove('saved');toast('Unsaved');}
  else{savedIds.add(id);btnSave.classList.add('saved');toast('Saved!');}
});
document.getElementById('btnMore').addEventListener('click',function(){closeMenu();openMore();});

// ── More sheet ────────────────────────────────────────────────────────────
function openMore(){
  moreOpen=true;
  document.getElementById('moreSheet').classList.add('open');
  document.getElementById('moreBack').classList.add('open');
  document.getElementById('moreProfile').focus();
}
function closeMore(){
  moreOpen=false;
  document.getElementById('moreSheet').classList.remove('open');
  document.getElementById('moreBack').classList.remove('open');
}
document.getElementById('moreBack').addEventListener('click',closeMore);
document.getElementById('moreCancel').addEventListener('click',closeMore);
document.getElementById('moreProfile').addEventListener('click',function(){closeMore();openProfile();});
document.getElementById('moreNext').addEventListener('click',function(){closeMore();show(idx+1,true,1);});
document.getElementById('moreCopy').addEventListener('click',function(){
  closeMore();if(!vids[idx])return;
  var url='https://www.youtube.com/shorts/'+vids[idx].ytVideoId;
  if(navigator.clipboard)navigator.clipboard.writeText(url).then(function(){toast('Link copied!');});
});
document.getElementById('moreSkip').addEventListener('click',function(){
  closeMore();if(vids[idx]){seenIds.add(vids[idx].aweme_id+'_skip');show(idx+1,true,1);toast('Got it');}
});

// ── Profile ───────────────────────────────────────────────────────────────
document.getElementById('profClose').addEventListener('click',closeProfile);
function closeProfile(){document.getElementById('profileOverlay').classList.remove('open');}

async function openProfile(){
  if(!vids[idx])return;
  var d=vids[idx];
  document.getElementById('profName').textContent=d.author.unique_id||'YouTuber';
  document.getElementById('profHandle').textContent='@'+(d.author.unique_id||'');
  document.getElementById('profAv').innerHTML=d.author.avatar?'<img src="'+d.author.avatar+'">':'▶';
  var grid=document.getElementById('profGrid');
  grid.innerHTML='<div class="prof-msg">Loading...</div>';
  document.getElementById('profileOverlay').classList.add('open');
  document.getElementById('profClose').focus();
  try{
    var params=new URLSearchParams({part:'snippet',q:(d.author.unique_id||'')+'#shorts',type:'video',videoDuration:'short',videoEmbeddable:'true',maxResults:10,key:'PLACEHOLDER'});
    var data=await ytFetch('https://www.googleapis.com/youtube/v3/search?'+params);
    var items=data.items||[];
    if(!items.length){grid.innerHTML='<div class="prof-msg">No videos found</div>';return;}
    grid.innerHTML='';
    items.forEach(function(v){
      var ytId=v.id.videoId;
      var thumb=document.createElement('div');
      thumb.className='prof-thumb focusable';
      var cover=v.snippet.thumbnails.high?.url||v.snippet.thumbnails.default?.url||'';
      if(cover)thumb.innerHTML='<img src="'+cover+'" loading="lazy">';
      thumb.addEventListener('click',function(){
        closeProfile();
        var aid='yt_'+ytId;
        if(!seenIds.has(aid)){
          seenIds.add(aid);
          vids.splice(idx+1,0,{aweme_id:aid,ytVideoId:ytId,title:v.snippet.title||'',author:d.author,digg_count:0,comment_count:0,cover:cover});
          var reel=document.createElement('div');
          reel.className='reel';reel.dataset.ytId=ytId;reel.dataset.ytReady='0';
          if(cover){var img=document.createElement('img');img.src=cover;img.style.cssText='width:100%;height:100%;object-fit:cover;position:absolute;inset:0';reel.appendChild(img);}
          var all=feed.querySelectorAll('.reel');
          if(idx+1<all.length)feed.insertBefore(reel,all[idx+1]);else feed.appendChild(reel);
          feed.querySelectorAll('.reel').forEach(function(r,n){r.style.top=n*100+'%';});
        }
        show(idx+1,true,1);
      });
      grid.appendChild(thumb);
    });
  }catch(err){grid.innerHTML='<div class="prof-msg">Could not load videos</div>';}
}

// ── YouTube API ───────────────────────────────────────────────────────────
var YT_KEYS=[
  'AIzaSyDz_P6WIbRBr31VO7fQX0UcP3tFSBlGEE0','AIzaSyDsL7qek4qkCjmyczIUArhK8krUq2QV3mo',
  'AIzaSyBKgt_-gM4Nnfkxj-6xz81tNHMydBLD0CQ','AIzaSyAxz8JgYT02TS12fcdIYVNqmhT_0OwA48Q',
  'AIzaSyDM_mZiXih02mMOCKEUgfrJhHU0RCO_W4Y','AIzaSyAAqJcN9TJiNpPSvvIX8IP2pDCbwrwbH68',
  'AIzaSyALpQ6mleh8v4SlVnk1V8nBZ2pTIUQAoLk','AIzaSyAGy9rR4lbNYMlRgQcluVUlCpuRFIWbnZk',
  'AIzaSyD1f3AnsJRrGmTTBWK_XsgwqLnDQv2mA00','AIzaSyB0cB1FlDb4Azzq2xh7_ENz2CvwpWJnJXg',
  'AIzaSyCjyaZibozhYOTolhznZ0zLz45mIqtOLaw','AIzaSyC9qC_Q3q-aDhVwfp4QOdIvecqQW04Mq3M',
  'AIzaSyDTIw26DvcDWRCGftd-c-_SdcllN0zvxE0','AIzaSyALn7in8kXrFCzC1VU51UqNFZ9YuLkwXNY',
  'AIzaSyB_3g7oRfcoKqQYqt7UPHwQNTt3BjLD4iw'
];
var ytKeyIdx=0;
var YT_QUERIES=['#shorts','funny shorts','comedy shorts','viral shorts','trending shorts'];
var ytQueryIdx=0;
var ytPageTokens={}; // per-query pagination cursor, keyed by query index

function parseIsoDuration(iso){if(!iso)return 999;var m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);if(!m)return 999;return(parseInt(m[1]||0)*3600)+(parseInt(m[2]||0)*60)+parseInt(m[3]||0);}

async function ytFetch(url){
  var tried=0;
  while(tried<YT_KEYS.length){
    var u=new URL(url);u.searchParams.set('key',YT_KEYS[ytKeyIdx%YT_KEYS.length]);
    try{
      var res=await fetch(u.toString());var data=await res.json();
      if(data.error){var r=data.error?.errors?.[0]?.reason||'';if(data.error.code===403&&(r==='quotaExceeded'||r==='dailyLimitExceeded')){ytKeyIdx++;tried++;continue;}throw new Error(data.error.message);}
      return data;
    }catch(err){ytKeyIdx++;tried++;continue;}
  }
  throw new Error('All keys exhausted');
}

async function loadBatch(){
  if(loading){loadPending=true;return;}
  loading=true;
  try{
    var qIdx=ytQueryIdx%YT_QUERIES.length;
    var q=YT_QUERIES[qIdx];
    var tok=ytPageTokens[qIdx]||'';
    var sp=new URLSearchParams({part:'snippet',q:q,type:'video',videoDuration:'short',videoEmbeddable:'true',maxResults:30,regionCode:'US',relevanceLanguage:'en',key:'PLACEHOLDER',...(tok?{pageToken:tok}:{})});
    var sd=await ytFetch('https://www.googleapis.com/youtube/v3/search?'+sp);
    ytPageTokens[qIdx]=sd.nextPageToken||'';
    if(!sd.nextPageToken)ytQueryIdx++; // only rotate queries once this one's pages are exhausted
    var candidates=sd.items||[];
    var snipMap={};candidates.forEach(function(v){snipMap[v.id.videoId]=v.snippet;});
    var ids=candidates.map(function(v){return v.id.videoId;}).join(',');
    var dd=await ytFetch('https://www.googleapis.com/youtube/v3/videos?'+new URLSearchParams({part:'contentDetails,statistics',id:ids,key:'PLACEHOLDER'}));
    var shorts=(dd.items||[]).filter(function(v){var s=parseIsoDuration(v.contentDetails?.duration);return s>0&&s<=60;});
    shorts.forEach(function(v){
      var id='yt_'+v.id;if(seenIds.has(id))return;seenIds.add(id);
      var sn=snipMap[v.id]||{};
      vids.push({aweme_id:id,ytVideoId:v.id,title:sn.title||'',author:{unique_id:sn.channelTitle||'YouTuber',avatar:''},digg_count:parseInt(v.statistics?.likeCount||0),comment_count:parseInt(v.statistics?.commentCount||0),cover:sn.thumbnails?.high?.url||''});
      var reel=document.createElement('div');reel.className='reel';reel.style.top=(vids.length-1)*100+'%';
      reel.dataset.ytId=v.id;reel.dataset.ytReady='0';
      if(sn.thumbnails?.high?.url){var img=document.createElement('img');img.src=sn.thumbnails.high.url;img.style.cssText='width:100%;height:100%;object-fit:cover;position:absolute;inset:0';reel.appendChild(img);}
      feed.appendChild(reel);
    });
  }catch(err){console.error('loadBatch',err);}
  loading=false;
  if(loadPending){loadPending=false;loadBatch();}
}

async function show(i,animate,dir){
  if(menuOpen)closeMenu();
  if(moreOpen)closeMore();
  if(i>=vids.length){loader.classList.add('show');await loadBatch();}
  if(!vids.length)return;
  if(i>=vids.length)i=vids.length-1;
  if(i<0)i=0;
  idx=i;
  var reels=document.querySelectorAll('.reel');
  var target='translateY('+(-idx*100)+'%)';
  if(animate){
    var from='translateY('+(-(idx-dir)*100)+'%)';
    feed.style.transition='none';feed.style.transform=from;
    feed.getBoundingClientRect();
    feed.style.transition='transform .3s cubic-bezier(.4,0,.2,1)';feed.style.transform=target;
  }else{feed.style.transition='none';feed.style.transform=target;}

  reels.forEach(function(r,n){
    var active=n===idx;
    r.classList.toggle('active',active);
    if(active){
      loader.classList.add('show');
      if(r.dataset.ytReady==='0'){
        var img=r.querySelector('img');if(img)img.remove();
        var ytId=r.dataset.ytId;
        var iframe=document.createElement('iframe');
        iframe.src='https://www.youtube.com/embed/'+ytId+'?autoplay=1&mute=0&loop=1&playlist='+ytId+'&controls=0&playsinline=1&rel=0&modestbranding=1&enablejsapi=1';
        iframe.allow='autoplay;fullscreen';iframe.allowFullscreen=true;
        iframe.setAttribute('loading','eager');
        iframe.style.cssText='width:100%;height:100%;border:none;position:absolute;inset:0;outline:none';
        r.appendChild(iframe);r.dataset.ytReady='1';
        iframe.addEventListener('load',function(){if(r.classList.contains('active'))loader.classList.remove('show');},{once:true});
      }else{
        var iframe=r.querySelector('iframe');
        if(iframe)iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}','*');
        loader.classList.remove('show');
      }
      var d=vids[n];
      document.getElementById('vidUser').textContent='@'+(d.author.unique_id||'');
      document.getElementById('vidCap').textContent=d.title||'';
      document.getElementById('vidStats').innerHTML='❤️ '+fmt(d.digg_count)+'  💬 '+fmt(d.comment_count||0);
      if(n>=vids.length-5)loadBatch();
    }else{
      var iframe=r.querySelector('iframe');
      if(iframe)iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}','*');
    }
  });
}

// ── App start ─────────────────────────────────────────────────────────────
document.getElementById('btnStart').addEventListener('click',async function(){
  document.getElementById('screen-splash').style.display='none';
  document.getElementById('screen-main').style.display='block';
  loader.classList.add('show');
  await loadBatch();
  await show(0,false,1);
  // After app starts, ArrowDown/Up navigate reels
  // Menu opens on Enter when no focusable is focused
  // This is handled by overriding the global keydown for navigation
  document.getElementById('screen-main').addEventListener('keydown',function(){},true);
});

// ── Navigation override when main screen is active ────────────────────────
// We intercept BEFORE the global moveFocus so we can handle reel navigation
document.addEventListener('keydown',function(e){
  var mainActive=document.getElementById('screen-main').style.display==='block';
  if(!mainActive)return;
  // If a specific focusable has focus (menu btn, more row, etc.) let global handler work
  var ae=document.activeElement;
  var inMenu=ae&&(ae.id==='btnLike'||ae.id==='btnShare'||ae.id==='btnSave'||ae.id==='btnMore');
  var inMore=ae&&ae.closest('#moreSheet');
  var inProfile=ae&&ae.closest('#profileOverlay');
  if(inMenu||inMore||inProfile)return; // let global moveFocus handle it
  // Nothing focused or body focused — handle reel navigation
  switch(e.key){
    case 'ArrowDown':show(idx+1,true,1);e.stopPropagation();break;
    case 'ArrowUp':show(idx-1,true,-1);e.stopPropagation();break;
    case 'Enter':
      if(menuOpen)closeMenu();
      else openMenu();
      e.stopPropagation();break;
  }
},true); // capture phase — fires before global keydown

// ── Prewarm YouTube ───────────────────────────────────────────────────────
(function(){
  var f=document.createElement('iframe');
  f.src='https://www.youtube.com/embed/?enablejsapi=1&autoplay=0&mute=1';
  f.allow='autoplay';
  f.style.cssText='position:fixed;width:1px;height:1px;top:-9999px;left:-9999px;border:none;pointer-events:none;opacity:0;';
  f.setAttribute('aria-hidden','true');
  document.body.appendChild(f);
  setTimeout(function(){if(f.parentNode)f.parentNode.removeChild(f);},20000);
})();

// Focus the Start button on load
window.addEventListener('load',function(){document.getElementById('btnStart').focus();});
</script>
