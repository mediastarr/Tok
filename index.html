<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TikTok – Global</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,system-ui;overflow:hidden}
.app{position:relative;width:100%;height:100%;max-width:500px;margin:0 auto}
.feed{height:100%;overflow:hidden;position:relative}
.video-wrap{position:absolute;inset:0;display:none}
.video-wrap.active{display:block}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.top{position:absolute;top:0;left:0;right:0;height:88px;padding-top:44px;display:flex;align-items:center;justify-content:space-between;padding:44px 12px 0;z-index:20;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.tabs{display:flex;gap:18px;font-size:16px;font-weight:500;color:#888}
.tabs span{transition:color.2s}
.tabs.active{color:#fff;position:relative}
.tabs.active:after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:#fff;border-radius:2px}
.right{position:absolute;right:8px;bottom:140px;display:flex;flex-direction:column;align-items:center;gap:20px;z-index:20}
.avatar{width:48px;height:48px;border-radius:50%;border:2px solid #fff;background:#333}
.action{display:flex;flex-direction:column;align-items:center;gap:4px}
.action svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 1px 3px #000)}
.action-count{font-size:12px;font-weight:600;text-shadow:0 1px 2px #000}
.bottom{position:absolute;left:12px;right:80px;bottom:100px;z-index:20}
.username{font-size:16px;font-weight:600;margin-bottom:4px;text-shadow:0 1px 3px #000}
.caption{font-size:14px;text-shadow:0 1px 3px #000}
.starter{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;gap:12px}
.starter.hide{display:none}
.play-btn{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center}
.play-btn svg{width:30px;height:30px;fill:#fff;margin-left:3px}
.debug{position:absolute;top:100px;left:12px;background:rgba(0,0,0,.8);padding:6px 10px;border-radius:6px;font:11px monospace;z-index:50}
</style>
</head>
<body>
<div class="app">
  <div class="starter" id="starter">
    <div class="play-btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    <div>Tap to start with sound</div>
  </div>

  <div class="feed" id="feed"></div>

  <div class="debug" id="debug">Ready</div>

  <div class="top">
    <div class="tabs" id="tabs">
      <span data-tab="0">Explore</span>
      <span data-tab="1">Local</span>
      <span data-tab="2">Following</span>
      <span data-tab="3">Shop</span>
      <span data-tab="4" class="active">For You</span>
    </div>
  </div>

  <div class="right">
    <img class="avatar" id="avatar" src="https://picsum.photos/100">
    <div class="action"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><div class="action-count" id="likes">8.3K</div></div>
    <div class="action"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 0 0 1-.9-3.8 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><div class="action-count">34</div></div>
  </div>

  <div class="bottom">
    <div class="username" id="user">@LOVIXX_MUSIC</div>
    <div class="caption" id="cap">but i live like a millionaire</div>
  </div>
</div>

<script>
const videos = [
  {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', user:'@LOVIXX_MUSIC', cap:'but i live like a millionaire', likes:8334},
  {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', user:'@trending', cap:'Global trending #fyp', likes:15420},
  {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', user:'@viral', cap:'This is trending now', likes:22100},
  {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', user:'@foryou', cap:'POV you found it', likes:18750},
  {url:'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4', user:'@tiktok', cap:'Wait for it...', likes:31200}
];

let current = 0;
let currentTab = 4;
const feed = document.getElementById('feed');
const debug = document.getElementById('debug');

function loadVideos() {
  videos.forEach((v,i)=>{
    const wrap = document.createElement('div');
    wrap.className = 'video-wrap';
    wrap.id = 'v'+i;
    wrap.innerHTML = `<video src="${v.url}" loop playsinline preload="auto"></video>`;
    feed.appendChild(wrap);
  });
  showVideo(0);
}

function showVideo(idx) {
  current = (idx + videos.length) % videos.length;
  document.querySelectorAll('.video-wrap').forEach((w,i)=>{
    w.classList.toggle('active', i===current);
    const vid = w.querySelector('video');
    if(i===current) {
      vid.currentTime = 0;
      vid.muted = false;
      vid.volume = 1;
      vid.play().then(()=>{
        debug.textContent = `Playing ${current+1}/${videos.length} • Sound ON`;
      }).catch(e=>{
        debug.textContent = 'Tap again to enable sound';
        vid.muted = true;
        vid.play();
      });
      document.getElementById('user').textContent = videos[current].user;
      document.getElementById('cap').textContent = videos[current].cap;
      document.getElementById('likes').textContent = format(videos[current].likes);
    } else {
      vid.pause();
    }
  });
}

function format(n){ return n>999? (n/1000).toFixed(1)+'K' : n }

function nextVideo(){ showVideo(current+1) }
function prevVideo(){ showVideo(current-1) }

function changeTab(dir){
  const tabs = document.querySelectorAll('#tabs span');
  currentTab = (currentTab + dir + tabs.length) % tabs.length;
  tabs.forEach((t,i)=>t.classList.toggle('active', i===currentTab));
  debug.textContent = `Tab: ${tabs[currentTab].textContent}`;
  // In real app, you'd reload videos for this tab here
}

// D-pad navigation
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown') nextVideo(); // down = next
  if(e.key==='ArrowUp') prevVideo(); // up = previous
  if(e.key==='ArrowRight') changeTab(1); // right = next tab
  if(e.key==='ArrowLeft') changeTab(-1); // left = prev tab
});

// Touch swipe
let startX=0, startY=0;
document.addEventListener('touchstart', e=>{
  startX = e.touches[0].clientX;
  startY = e.touches[0].clientY;
}, {passive:true});

document.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - startX;
  const dy = e.changedTouches[0].clientY - startY;

  if(Math.abs(dx) > Math.abs(dy)) {
    // Horizontal swipe
    if(Math.abs(dx) > 50) {
      if(dx > 0) changeTab(-1); // swipe right = left tab
      else changeTab(1); // swipe left = right tab
    }
  } else {
    // Vertical swipe - YOU REQUESTED: up=prev, down=next
    if(Math.abs(dy) > 50) {
      if(dy > 0) nextVideo(); // swipe down = next
      else prevVideo(); // swipe up = previous
    }
  }
}, {passive:true});

// Start
document.getElementById('starter').onclick = ()=>{
  document.getElementById('starter').classList.add('hide');
  loadVideos();
};
</script>
</body>
</html>
