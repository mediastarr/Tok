<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{
  color:#fff;
  font-family:-apple-system,system-ui,sans-serif;
  touch-action:none;
  -webkit-user-select:none;
  user-select:none;
}

.stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
}

.card{
  height:82vh;
  aspect-ratio:9/16;
  border-radius:14px;
  overflow:hidden;
  position:relative;
  transition:height .2s ease;
  flex-shrink:0;
  background:#000;
  cursor:pointer;
  pointer-events:none;
}
body.ready .card{pointer-events:auto}
body.menu-active .card{height:48vh}

/* FEED */
#feed{
  position:absolute;inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
#feed.swiping{transition:none}
.reel{
  position:absolute;left:0;width:100%;height:100%;
  background:#000;
}
.reel video{
  width:100%;height:100%;object-fit:cover;
}

/* VIDEO INFO */
.vid-info{
  position:absolute;left:0;right:0;bottom:0;
  padding:48px 12px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  pointer-events:none;z-index:3;
  transition:opacity .2s;
}
body.menu-active .vid-info{opacity:0}
.vid-info-user{font-size:13px;font-weight:700;margin-bottom:3px}
.vid-info-cap{font-size:12px;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-info-stats{font-size:11px;color:#aaa;margin-top:4px;display:flex;gap:10px}

/* PLAY OVERLAY */
.play-overlay{
  position:absolute;inset:0;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3);
  pointer-events:none;z-index:5;
}
body.menu-active .play-overlay{display:flex}
.play-circle{
  width:48px;height:48px;border-radius:50%;
  background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.6);
  display:flex;align-items:center;justify-content:center;
}
.play-circle svg{width:20px;height:20px;fill:#fff;margin-left:2px}

/* MENU INFO */
.menu-info{display:none;flex-direction:column;align-items:flex-start;max-width:80%}
body.menu-active .menu-info{display:flex}
.menu-user-row{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.menu-avatar{width:22px;height:22px;border-radius:50%;background:#444;border:1px solid #666;overflow:hidden}
.menu-cap{font-size:12px;color:#ccc;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-stats{font-size:11px;color:#aaa;margin-top:4px;display:flex;gap:12px}

/* ACTION BAR */
.menu-actions{
  display:none;gap:18px;padding:10px 24px;
  background:rgba(50,50,50,.8);border-radius:40px;
}
body.menu-active .menu-actions{display:flex}
.action-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.action-btn svg{width:24px;height:24px;fill:#fff;opacity:.85}
.action-btn.liked svg{fill:#fe2c55;opacity:1}
.action-btn.saved svg{fill:#ffe135;opacity:1}

/* TOAST */
.toast{
  position:fixed;bottom:30px;left:50%;
  transform:translateX(-50%);
  background:rgba(60,60,60,.85);
  color:#fff;padding:7px 16px;border-radius:20px;
  font-size:12px;opacity:0;transition:opacity .3s;
  pointer-events:none;z-index:200;
}
.toast.show{opacity:1}

/* LOADER */
.loader{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.4);
  z-index:4;pointer-events:none;
  opacity:0;transition:opacity .2s;
}
.loader.show{opacity:1}
.spin{
  width:32px;height:32px;
  border:3px solid rgba(255,255,255,.2);
  border-top-color:#fff;
  border-radius:50%;
  animation:sp .8s linear infinite;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* SPLASH */
.splash{
  position:fixed;inset:0;z-index:999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;gap:16px;
}
.splash-icon{
  width:72px;height:72px;border-radius:50%;
  background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
}
.splash-text{color:#fff;font-size:15px}
/* PROFILE OVERLAY */
.profile-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.92);
  display:none;flex-direction:column;align-items:center;
  padding:24px;gap:10px;
  touch-action:none;
}
.profile-overlay.open{display:flex}
.profile-av{
  width:72px;height:72px;border-radius:50%;
  background:#333;border:2px solid #555;
  overflow:hidden;flex-shrink:0;
}
.profile-av img{width:100%;height:100%;object-fit:cover}
.profile-av-placeholder{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;
}
.profile-name{font-size:16px;font-weight:700}
.profile-handle{font-size:13px;color:#aaa;margin-top:2px}
.profile-stats{
  display:flex;gap:20px;margin-top:8px;
}
.profile-stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.profile-stat-val{font-size:15px;font-weight:700}
.profile-stat-lbl{font-size:10px;color:#888}

.profile-videos{
  width:100%;
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:3px;margin-top:8px;
  max-height:35vh;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}
.profile-vid-thumb{
  aspect-ratio:9/16;background:#222;border-radius:4px;overflow:hidden;
  cursor:pointer;
}
.profile-vid-thumb img{width:100%;height:100%;object-fit:cover}
.profile-close{
  margin-top:10px;font-size:13px;color:#ccc;
  padding:6px 12px;border-radius:12px;
  background:rgba(255,255,255,.08);
  cursor:pointer;
}

/* MORE SHEET */
.more-sheet{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(100%);
  width:90%;max-width:360px;
  background:#1a1a1a;border-radius:18px 18px 0 0;
  z-index:400;padding:12px 0 24px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.more-sheet.open{transform:translateX(-50%) translateY(0)}
.more-sheet-handle{
  width:36px;height:4px;border-radius:2px;
  background:#555;margin:0 auto 16px;
}
.more-row{
  display:flex;align-items:center;gap:14px;
  padding:13px 20px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.more-row:active{background:rgba(255,255,255,.06)}
.more-backdrop{
  position:fixed;inset:0;z-index:399;
  background:rgba(0,0,0,.5);display:none;
}
.more-backdrop.open{display:block}
.more-sheet-cancel{
  margin:8px 20px 0;padding:12px;border-radius:12px;
  background:rgba(255,255,255,.08);text-align:center;
  font-size:14px;cursor:pointer;
}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-icon">▶</div>
  <div class="splash-text">Tap to Start</div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div id="feed"></div>
    <div class="vid-info" id="vidInfo">
      <div class="vid-info-user" id="vidUser"></div>
      <div class="vid-info-cap" id="vidCap"></div>
      <div class="vid-info-stats" id="vidStats"></div>
    </div>
    <div class="play-overlay">
      <div class="play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>

  <div class="menu-info" id="menuInfo">
    <div class="menu-user-row">
      <div class="menu-avatar" id="menuAvatar"></div>
      <span id="menuUser">@user</span>
    </div>
    <div class="menu-cap" id="menuCap"></div>
    <div class="menu-stats" id="menuStats"></div>
  </div>

  <div class="menu-actions" id="menuActions">
    <div class="action-btn" id="btnLike"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <div class="action-btn" id="btnShare"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    <div class="action-btn" id="btnSave"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="action-btn" id="btnMore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="profile-overlay" id="profileOverlay">
  <div class="profile-av" id="profileAv"><div class="profile-av-placeholder">👤</div></div>
  <div class="profile-name" id="profileName"></div>
  <div class="profile-handle" id="profileHandle"></div>
  <div class="profile-stats" id="profileStats"></div>
  <div class="profile-videos" id="profileVideos"></div>
  <div class="profile-close" id="profileClose">Close</div>
</div>

<div class="more-backdrop" id="moreBackdrop"></div>
<div class="more-sheet" id="moreSheet">
  <div class="more-sheet-handle"></div>
  <div class="more-row" id="moreProfile">View Creator Profile</div>
  <div class="more-row" id="moreNext">Skip to Next Video</div>
  <div class="more-row" id="moreCopyLink">Copy Link</div>
  <div class="more-row" id="moreNotInterested">Not Interested</div>
  <div class="more-sheet-cancel" id="moreCancel">Cancel</div>
</div>
<script>
let vids=[],idx=0,loading=false,menuOpen=false,profileOpen=false;
let userTouched=false;
let sx=0,sy=0;
const seenIds=new Set(),likedIds=new Set(),savedIds=new Set();

const feed=document.getElementById('feed');
const card=document.getElementById('card');
const loader=document.getElementById('loader');
const toastEl=document.getElementById('toast');
const profileOverlay=document.getElementById('profileOverlay');
const profileVideos=document.getElementById('profileVideos');
const moreSheet=document.getElementById('moreSheet');
const moreBackdrop=document.getElementById('moreBackdrop');

function fmt(n){
  if(!n) return '0';
  return n>1e6?(n/1e6).toFixed(1)+'M':n>1e3?(n/1e3).toFixed(1)+'K':String(n);
}

function toast(msg){
  clearTimeout(toastEl._t);
  toastEl.textContent=msg;
  toastEl.classList.add('show');
  toastEl._t=setTimeout(()=>toastEl.classList.remove('show'),1600);
}

function updateOverlay(d){
  document.getElementById('vidUser').textContent='@'+(d.author?.unique_id||'user');
  document.getElementById('vidCap').textContent=d.title||'';
  document.getElementById('vidStats').innerHTML=
    '<span>❤️ '+fmt(d.digg_count)+'</span>'+
    '<span>↗️ '+fmt(d.share_count||0)+'</span>';
}

/* MENU */
function openMenu(){
  if(menuOpen) return;
  menuOpen=true;
  document.body.classList.add('menu-active');
}
function closeMenu(){
  if(!menuOpen) return;
  menuOpen=false;
  document.body.classList.remove('menu-active');
}

/* MORE SHEET */
function openMore(){
  moreSheet.classList.add('open');
  moreBackdrop.classList.add('open');
}
function closeMore(){
  moreSheet.classList.remove('open');
  moreBackdrop.classList.remove('open');
}

document.getElementById('btnMore').addEventListener('click',e=>{
  e.stopPropagation();
  openMore();
});
moreBackdrop.addEventListener('click',closeMore);
document.getElementById('moreCancel').addEventListener('click',closeMore);

document.getElementById('moreNext').addEventListener('click',()=>{
  closeMore();
  closeMenu();
  show(idx+1,true,1);
});

document.getElementById('moreCopyLink').addEventListener('click',()=>{
  closeMore();
  if(!vids[idx]) return;
  const d=vids[idx];
  const url='https://www.tiktok.com/@'+(d.author?.unique_id||'user')+'/video/'+d.aweme_id;
  navigator.clipboard.writeText(url).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed'));
});

document.getElementById('moreNotInterested').addEventListener('click',()=>{
  closeMore();
  closeMenu();
  if(vids[idx]){
    seenIds.add(vids[idx].aweme_id+'_skip');
    show(idx+1,true,1);
    toast('Got it — showing less like this');
  }
});

document.getElementById('moreProfile').addEventListener('click',()=>{
  closeMore();
  openProfile();
});

/* LIKE / SHARE / SAVE */
const btnLike=document.getElementById('btnLike');
const btnShare=document.getElementById('btnShare');
const btnSave=document.getElementById('btnSave');

btnLike.addEventListener('click',e=>{
  e.stopPropagation();
  if(!vids[idx]) return;
  const id=vids[idx].aweme_id;
  if(likedIds.has(id)){
    likedIds.delete(id);
    btnLike.classList.remove('liked');
    toast('Removed like');
  }else{
    likedIds.add(id);
    btnLike.classList.add('liked');
    toast('Liked!');
  }
});

btnShare.addEventListener('click',e=>{
  e.stopPropagation();
  if(!vids[idx]) return;
  const d=vids[idx];
  const url='https://www.tiktok.com/@'+(d.author?.unique_id||'user')+'/video/'+d.aweme_id;
  if(navigator.share){
    navigator.share({title:d.title||'TikTok',url}).catch(()=>{});
  }else{
    navigator.clipboard.writeText(url).then(()=>toast('Link copied!')).catch(()=>toast('Copy failed'));
  }
});

btnSave.addEventListener('click',e=>{
  e.stopPropagation();
  if(!vids[idx]) return;
  const id=vids[idx].aweme_id;
  if(savedIds.has(id)){
    savedIds.delete(id);
    btnSave.classList.remove('saved');
    toast('Unsaved');
  }else{
    savedIds.add(id);
    btnSave.classList.add('saved');
    toast('Saved!');
  }
});
/* BLOCK POINTER INSIDE PROFILE */
['pointerdown','pointermove','pointerup'].forEach(ev=>{
  profileOverlay.addEventListener(ev,e=>e.stopPropagation(),{passive:false});
  profileVideos.addEventListener(ev,e=>e.stopPropagation(),{passive:false});
});

/* SWIPE HANDLER ATTACH/DETACH */
function detachSwipeHandlers(){
  window.removeEventListener('pointerdown',onPointerDown);
  window.removeEventListener('pointerup',onPointerUp);
}
function attachSwipeHandlers(){
  window.addEventListener('pointerdown',onPointerDown,{passive:true});
  window.addEventListener('pointerup',onPointerUp,{passive:true});
}

/* PROFILE */
async function openProfile(){
  if(!vids[idx]) return;
  profileOpen=true;
  profileOverlay.classList.add('open');

  /* HARD LOCK FEED */
  detachSwipeHandlers();
  card.style.pointerEvents='none';

  const d=vids[idx];
  document.getElementById('profileName').textContent=d.author?.nickname||d.author?.unique_id||'User';
  document.getElementById('profileHandle').textContent='@'+(d.author?.unique_id||'user');
  document.getElementById('profileStats').innerHTML=
    '<div class="profile-stat"><div class="profile-stat-val">—</div><div class="profile-stat-lbl">Followers</div></div>'+
    '<div class="profile-stat"><div class="profile-stat-val">'+fmt(d.digg_count)+'</div><div class="profile-stat-lbl">Likes</div></div>'+
    '<div class="profile-stat"><div class="profile-stat-val">'+fmt(d.comment_count||0)+'</div><div class="profile-stat-lbl">Comments</div></div>';

  const avEl=document.getElementById('profileAv');
  avEl.innerHTML=d.author?.avatar?'<img src="'+d.author.avatar+'">':'<div class="profile-av-placeholder">👤</div>';

  const thumbsEl=document.getElementById('profileVideos');
  thumbsEl.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#666;font-size:12px">Loading videos...</div>';

  try{
    const handle=d.author?.unique_id;
    if(!handle) throw new Error('no handle');
    const res=await fetch('https://www.tikwm.com/api/user/posts?unique_id='+encodeURIComponent(handle)+'&count=9&cursor=0&_='+Date.now());
    const data=await res.json();
    const videos=data?.data?.videos||[];

    if(videos.length===0){
      thumbsEl.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#666;font-size:12px">No videos found</div>';
      return;
    }

    thumbsEl.innerHTML='';
    videos.slice(0,9).forEach(v=>{
      const thumb=document.createElement('div');
      thumb.className='profile-vid-thumb';
      if(v.cover) thumb.innerHTML='<img src="'+v.cover+'" loading="lazy">';
      thumb.addEventListener('pointerup',e=>{
        e.stopPropagation();
        playProfileVid(v.play,v.video_id);
      });
      thumbsEl.appendChild(thumb);
    });
  }catch(e){
    thumbsEl.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#666;font-size:12px">Could not load videos</div>';
  }
}

function closeProfile(){
  profileOpen=false;
  profileOverlay.classList.remove('open');
  card.style.pointerEvents='auto';
  attachSwipeHandlers();
}

document.getElementById('profileClose').addEventListener('pointerup',e=>{
  e.stopPropagation();
  closeProfile();
});

/* PLAY PROFILE VIDEO */
function playProfileVid(videoUrl,videoId){
  closeProfile();

  const existingIdx=vids.findIndex(v=>v.aweme_id===videoId);
  if(existingIdx!==-1){
    show(existingIdx,true,1);
    return;
  }

  const d=vids[idx];
  const newVid={
    aweme_id:videoId,
    videoUrl:videoUrl,
    title:'',
    author:d.author,
    digg_count:0,share_count:0,comment_count:0,
    duration:60,region:'US',cover:''
  };

  const insertAt=idx+1;
  vids.splice(insertAt,0,newVid);

  const reel=document.createElement('div');
  reel.className='reel';
  const video=document.createElement('video');
  video.playsInline=true;
  video.preload='auto';
  video.muted=true;
  video.src=videoUrl;
  video.setAttribute('webkit-playsinline','true');
  video.addEventListener('playing',()=>{
    if(reel.classList.contains('active')){
      loader.classList.remove('show');
      if(userTouched&&video.muted){video.muted=false;video.volume=1;}
    }
  });
  video.addEventListener('ended',()=>{video.currentTime=0;video.play().catch(()=>{});});
  reel.appendChild(video);

  const allReels=feed.querySelectorAll('.reel');
  if(insertAt<allReels.length){
    feed.insertBefore(reel,allReels[insertAt]);
  }else{
    feed.appendChild(reel);
  }

  feed.querySelectorAll('.reel').forEach((r,n)=>{r.style.top=n*100+'%';});
  show(insertAt,true,1);
}
const PROXY='https://tiktok-proxy.mediastarr86.workers.dev';

async function loadFromTikWM(){
  const res=await fetch('https://www.tikwm.com/api/feed/list?region=US&count=20&language=en&_='+Date.now());
  const data=await res.json();
  if(!data.data||!data.data.length) throw new Error('empty');
  return (data.data||[]).map(v=>({
    aweme_id:v.video_id,
    videoUrl:v.play,
    title:v.title||'',
    author:{unique_id:v.author?.unique_id||'user',avatar:v.author?.avatar||'',nickname:v.author?.nickname||''},
    digg_count:v.digg_count||0,
    share_count:v.share_count||0,
    comment_count:v.comment_count||0,
    duration:v.duration||15,
    region:v.region||'US',
    cover:v.cover||''
  }));
}

function addToFeed(items){
  let added=0;
  const feedEl=document.getElementById('feed');
  for(const v of items){
    if(seenIds.has(v.aweme_id)) continue;
    if(v.region&&v.region!=='US') continue;
    if(v.duration===0||v.duration>60) continue;
    if(!v.videoUrl||!v.videoUrl.includes('tiktokcdn')) continue;
    seenIds.add(v.aweme_id);
    vids.push(v);
    const reel=document.createElement('div');
    reel.className='reel';
    reel.style.top=(vids.length-1)*100+'%';
    const video=document.createElement('video');
    video.playsInline=true;video.preload='none';video.muted=true;
    video.setAttribute('webkit-playsinline','true');
    video.addEventListener('playing',()=>{
      if(reel.classList.contains('active')){
        loader.classList.remove('show');
        if(userTouched&&video.muted){video.muted=false;video.volume=1;}
      }
    });
    video.addEventListener('ended',()=>{video.currentTime=0;video.play().catch(()=>{});});
    reel.appendChild(video);
    feedEl.appendChild(reel);
    added++;
  }
  return added;
}

async function loadBatch(){
  if(loading) return 0;
  loading=true;
  let totalAdded=0;
  try{
    const rawItems=await loadFromTikWM();
    totalAdded=addToFeed(rawItems);
  }catch(e){console.error('loadBatch error',e);}
  loading=false;
  return totalAdded;
}

function preloadAhead(){
  const reels=document.querySelectorAll('.reel');
  for(let o=1;o<=3;o++){
    const ni=idx+o;
    if(ni<vids.length&&reels[ni]){
      const v=reels[ni].querySelector('video');
      if(!v.src){v.src=vids[ni].videoUrl;v.preload='auto';v.load();}
    }
  }
}

async function show(i,animate=false,dir=1){
  if(i>=vids.length){
    await loadBatch();
    if(i>=vids.length)i=vids.length-1;
  }
  if(i<0)i=0;
  idx=i;
  const reels=document.querySelectorAll('.reel');

  if(animate){
    feed.classList.add('swiping');
    feed.style.transform='translateY('+((-(idx-dir)*100))+'%)';
    feed.getBoundingClientRect();
    feed.classList.remove('swiping');
    feed.style.transform='translateY('+(-(idx*100))+'%)';
  }else{
    feed.style.transform='translateY('+(-(idx*100))+'%)';
  }

  reels.forEach((r,n)=>{
    const isActive=n===idx;
    r.classList.toggle('active',isActive);
    const vid=r.querySelector('video');
    if(isActive){
      loader.classList.add('show');
      if(!vid.src) vid.src=vids[n].videoUrl;
      vid.preload='auto';
      vid.muted=false;vid.volume=1;
      const tryPlay=()=>{
        vid.play().catch(()=>{vid.muted=true;vid.play().catch(()=>{});});
      };
      if(vid.readyState>=2){
        tryPlay();
      }else{
        const h=()=>{vid.removeEventListener('canplay',h);tryPlay();};
        vid.addEventListener('canplay',h);
        vid.load();
      }
      updateOverlay(vids[n]);
      preloadAhead();
      if(n>=vids.length-3) loadBatch();
    }else{
      vid.pause();
      if(Math.abs(n-idx)>6) vid.removeAttribute('src');
    }
  });
}
/* SPLASH */
document.getElementById('splash').addEventListener('pointerup',async e=>{
  e.stopPropagation();
  userTouched=true;
  document.getElementById('splash').style.display='none';
  document.body.classList.add('ready');
  loader.classList.add('show');

  await loadBatch();
  await show(0);

  const v=document.querySelector('.reel.active video');
  if(v){v.muted=false;v.volume=1;}
},{once:true});

/* CARD CLICK → MENU */
card.addEventListener('click',e=>{
  e.stopPropagation();
  if(profileOpen) return;
  if(!menuOpen) openMenu(); else closeMenu();
});

/* POINTER SWIPE ENGINE */
function onPointerDown(e){
  if(profileOpen) return;
  sx=e.clientX;sy=e.clientY;
}
function onPointerUp(e){
  if(profileOpen) return;
  if(moreSheet.classList.contains('open')) return;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  const isSwipe=Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx);
  if(menuOpen){
    if(isSwipe&&dy<-50) closeMenu();
    return;
  }
  if(isSwipe){
    if(dy>50) show(idx+1,true,1);
    else show(idx-1,true,-1);
  }
}

attachSwipeHandlers();

/* KEYBOARD */
addEventListener('keydown',e=>{
  if(!userTouched)userTouched=true;
  if(profileOpen){
    if(e.key==='Escape'){closeProfile();}
    return;
  }
  if(menuOpen){
    if(e.key==='Escape'||e.key==='ArrowUp'||e.key==='Enter'){closeMenu();return;}
    return;
  }
  if(e.key==='ArrowDown') show(idx+1,true,1);
  if(e.key==='ArrowUp') show(idx-1,true,-1);
});
</script>
