<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden;touch-action:none}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:40px;left:0;right:0;display:flex;justify-content:center;gap:20px;font-size:16px}
.tab{color:#888}.tab.active{color:#fff;font-weight:600}
.right{position:absolute;right:12px;bottom:180px;display:flex;flex-direction:column;gap:24px;align-items:center}
.icon{width:48px;text-align:center}
.icon svg{width:32px;height:32px;fill:#fff;filter:drop-shadow(0 2px 4px #000)}
.count{font-size:12px;margin-top:4px;text-shadow:0 1px 2px #000}
.bottom{position:absolute;left:12px;bottom:120px;right:80px}
.user{font-weight:600;margin-bottom:4px;text-shadow:0 1px 3px #000}
.cap{font-size:14px;text-shadow:0 1px 3px #000}
.start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.start.hide{display:none}
.btn{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.btn svg{width:40px;height:40px;fill:#000;margin-left:4px}
.status{position:absolute;top:80px;left:12px;background:rgba(0,0,0,.8);padding:8px 12px;border-radius:8px;font:12px monospace;z-index:200}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div>TAP TO START WITH SOUND</div>
</div>

<video id="vid" playsinline webkit-playsinline></video>

<div class="ui">
  <div class="top" id="tabs">
    <span class="tab">Explore</span>
    <span class="tab">Local</span>
    <span class="tab">Following</span>
    <span class="tab">Shop</span>
    <span class="tab active">For You</span>
  </div>

  <div class="right">
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg><div class="count" id="likes">8.3K</div></div>
    <div class="icon"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 0 0 1-.9-3.8 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><div class="count">34</div></div>
  </div>

  <div class="bottom">
    <div class="user" id="user">@LOVIXX_MUSIC</div>
    <div class="cap" id="cap">but i live like a millionaire</div>
  </div>
</div>

<div class="status" id="status">Waiting for tap...</div>

<script>
const videos = [
  {src:'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_1MB.mp4', user:'@LOVIXX_MUSIC', cap:'but i live like a millionaire', likes:'8.3K'},
  {src:'https://test-videos.co.uk/vids/jellyfish/mp4/h264/360/Jellyfish_360_10s_1MB.mp4', user:'@trending', cap:'Global trending', likes:'15.4K'},
  {src:'https://test-videos.co.uk/vids/sintel/mp4/h264/360/Sintel_360_10s_1MB.mp4', user:'@viral', cap:'Wait for it', likes:'22.1K'}
];

let idx = 0;
let tabIdx = 4;
const vid = document.getElementById('vid');
const status = document.getElementById('status');

function loadVideo(i) {
  idx = (i + videos.length) % videos.length;
  const v = videos[idx];

  status.textContent = `Loading ${idx+1}...`;
  vid.src = v.src;
  vid.load();

  // Critical: play muted first, then unmute
  vid.muted = true;
  vid.play().then(()=>{
    setTimeout(()=>{
      vid.muted = false;
      vid.volume = 1.0;
      status.textContent = `Playing ${idx+1}/${videos.length} • SOUND ON`;
    }, 100);
  }).catch(e=>{
    status.textContent = 'Error: '+e.message;
  });

  document.getElementById('user').textContent = v.user;
  document.getElementById('cap').textContent = v.cap;
  document.getElementById('likes').textContent = v.likes;
}

function next(){ loadVideo(idx+1) }
function prev(){ loadVideo(idx-1) }

function changeTab(d){
  const tabs = document.querySelectorAll('.tab');
  tabIdx = (tabIdx + d + tabs.length) % tabs.length;
  tabs.forEach((t,i)=>t.classList.toggle('active', i===tabIdx));
  status.textContent = 'Tab: '+tabs[tabIdx].textContent;
}

// Start button - THIS IS THE KEY
document.getElementById('start').onclick = async ()=>{
  document.getElementById('start').classList.add('hide');
  status.textContent = 'Starting...';

  // Unlock audio with user gesture
  try {
    await vid.play();
    vid.pause();
    loadVideo(0);
  } catch(e) {
    status.textContent = 'Failed: '+e;
  }
};

// D-pad
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown') next();
  if(e.key==='ArrowUp') prev();
  if(e.key==='ArrowLeft') changeTab(-1);
  if(e.key==='ArrowRight') changeTab(1);
});

// Swipe
let sx=0, sy=0;
document.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY }, {passive:true});
document.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > 50) {
    changeTab(dx<0? 1 : -1);
  } else if(Math.abs(dy) > 50) {
    dy>0? next() : prev(); // down=next, up=prev
  }
}, {passive:true});

vid.addEventListener('error', ()=>{ status.textContent = 'Video error - trying next'; setTimeout(next, 1000) });
vid.addEventListener('ended', next);
</script>
</body>
</html>
