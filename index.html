<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden;touch-action:none}
.reel{position:absolute;inset:0;display:none;background:#000}
.reel.active{display:block}
.reel iframe{width:100%;height:100%;border:0;pointer-events:none} /* FIX: lets swipes work */
.ui{position:absolute;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:15px}
.tab{color:#888}.tab.active{color:#fff;font-weight:600}
.bottom{position:absolute;left:12px;bottom:110px;right:12px}
.user{font-weight:600;text-shadow:0 1px 3px #000}
.cap{font-size:14px;margin-top:3px;text-shadow:0 1px 3px #000}
.start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.btn{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.btn svg{width:36px;height:36px;fill:#000;margin-left:3px}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div>TAP TO START</div>
</div>

<div id="feed"></div>

<div class="ui">
  <div class="top">
    <span class="tab">Explore</span><span class="tab">Local</span><span class="tab">Following</span><span class="tab">Shop</span><span class="tab active">For You</span>
  </div>
  <div class="bottom">
    <div class="user" id="user">@tiktok</div>
    <div class="cap" id="cap">Loading...</div>
  </div>
</div>

<script>
let vids=[], idx=0, tab=4, loading=false;
const tabs=document.querySelectorAll('.tab');

async function loadBatch(){
  if(loading) return; loading=true;
  const res=await fetch('https://www.tikwm.com/api/feed/list?region=US&count=15&_='+Date.now());
  const data=await res.json();
  const feed=document.getElementById('feed');

  data.data.forEach(v=>{
    if(vids.find(x=>x.video_id===v.video_id)) return;
    vids.push(v);
    const div=document.createElement('div');
    div.className='reel';
    div.innerHTML=`<iframe src="https://www.tiktok.com/embed/v2/${v.video_id}?autoplay=1&muted=0" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>`;
    feed.appendChild(div);
  });
  loading=false;
}

function show(i){
  if(i>=vids.length-2) loadBatch();
  idx=(i+vids.length)%vids.length;
  document.querySelectorAll('.reel').forEach((r,n)=>r.classList.toggle('active',n===idx));
  document.getElementById('user').textContent='@'+vids[idx].author.unique_id;
  document.getElementById('cap').textContent=vids[idx].title;
}

function changeTab(d){tab=(tab+d+5)%5;tabs.forEach((t,i)=>t.classList.toggle('active',i===tab));}

document.getElementById('start').onclick=async()=>{
  document.getElementById('start').style.display='none';
  await loadBatch();
  show(0);
  // Force audio unlock
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') await ctx.resume();
};

// SWIPES WORK NOW
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40) changeTab(dx<0?1:-1);
  else if(Math.abs(dy)>40) dy<-40?show(idx-1):show(idx+1);
},{passive:true});

addEventListener('keydown',e=>{
  if(e.key==='ArrowDown')show(idx+1);
  if(e.key==='ArrowUp')show(idx-1);
  if(e.key==='ArrowRight')changeTab(1);
  if(e.key==='ArrowLeft')changeTab(-1);
});
</script>
<script async src="https://www.tiktok.com/embed.js"></script>
</body>
</html>
