<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600,initial-scale=1,user-scalable=no">
<title>TikTok • Herald Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:600px;height:600px;background:#000;color:#fff;font-family:-apple-system,system-ui;overflow:hidden}
 .app{position:relative;width:100%;height:100%;background:#000}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
 .top{position:absolute;top:0;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.8),transparent);font-size:14px;pointer-events:none}
 .right-bar{position:absolute;right:8px;bottom:120px;display:flex;flex-direction:column;gap:20px;z-index:20}
 .btn{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;background:rgba(0,0,0,.4);border-radius:22px;backdrop-filter:blur(10px)}
 .btn svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
 .btn span{font-size:10px}
 .bottom{position:absolute;left:0;right:0;bottom:0;padding:16px;padding-right:70px;background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);z-index:10;pointer-events:none}
 .user{font-weight:600;font-size:14px}
 .caption{font-size:13px;opacity:.9;margin-top:2px}
 .tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:50;flex-direction:column;gap:10px;cursor:pointer}
 .tap.hide{display:none}
 .tap div{font-size:20px}.tap span{font-size:13px;opacity:.6}
 .nav{position:absolute;inset:0;z-index:15;display:grid;grid-template-rows:1fr 1fr}
 .nav div{cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <div id="player"></div>

  <div class="tap" id="starter">
    <div>▶ Tap to start</div>
    <span>Sound enabled • Swipe up/down</span>
  </div>

  <div class="top"><div>TikTok</div><div id="time">9:41</div></div>

  <div class="nav">
    <div onclick="prev()"></div>
    <div onclick="next()"></div>
  </div>

  <div class="right-bar">
    <div class="btn" onclick="like()"><svg viewBox="0 0 24 24"><path d="M12 21l-1.4-1.3C5 15 2 12 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.5-3 6.5-8.6 11.2L12 21z"/></svg><span id="likes">1.2M</span></div>
    <div class="btn"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 0 0 1-.9-3.8 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 0 0 1 8 8v.5z"/></svg><span>24K</span></div>
    <div class="btn" onclick="toggleSound()"><svg id="soundIcon" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z M19 12c0-2.5-1.5-4.6-3.7-5.5 M19 12c0 2.5-1.5 4.6-3.7 5.5"/></svg><span id="soundTxt">Sound</span></div>
  </div>

  <div class="bottom">
    <div class="user" id="user">@logagm</div>
    <div class="caption" id="cap">The og best way to eat a whole cucumber</div>
  </div>
</div>

<script>
// Real TikTok videos (from TikTok's official embed)
const reels = [
  {id:'7394126805550058758', user:'@logagm', cap:'The og best way to eat a whole cucumber', likes:'1.2M'},
  {id:'7264266991727299882', user:'@amandaeveart', cap:'POV: you found the perfect art supply', likes:'847K'},
  {id:'6718335390845095173', user:'@scout2015', cap:'Scramble up ur name & I’ll guess it 😍', likes:'2.4M'},
  {id:'7231234567890123456', user:'@foodtok', cap:'3am pasta hits different', likes:'3.1M'},
  {id:'7189876543210987654', user:'@tech', cap:'Ray-Ban Meta tip you need', likes:'567K'}
];

let idx=0, soundOn=true;
const player=document.getElementById('player');
const starter=document.getElementById('starter');

function load(i){
  idx=(i+reels.length)%reels.length;
  const r=reels[idx];
  // Official TikTok embed - supports sound, no API key needed
  player.innerHTML = `<iframe src="https://www.tiktok.com/embed/${r.id}?autoplay=1&sound=${soundOn?1:0}" allow="autoplay; fullscreen" style="width:100%;height:100%"></iframe>`;
  document.getElementById('user').textContent=r.user;
  document.getElementById('cap').textContent=r.cap;
  document.getElementById('likes').textContent=r.likes;
}

function next(){load(idx+1)}
function prev(){load(idx-1)}
function like(){const el=document.getElementById('likes');el.textContent='❤️'}

function toggleSound(){
  soundOn=!soundOn;
  document.getElementById('soundTxt').textContent=soundOn?'Sound':'Mute';
  load(idx); // reload with sound setting
}

starter.onclick=()=>{
  starter.classList.add('hide');
  load(0);
};

// Swipe
let sy=0;
document.addEventListener('touchstart',e=>sy=e.touches[0].clientY,{passive:true});
document.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;if(Math.abs(dy)>50)dy<0?next():prev()},{passive:true});

// Time
setInterval(()=>document.getElementById('time').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);
</script>
</body>
</html>
