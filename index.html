<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui;height:100vh;overflow:hidden}
.feed{position:relative;width:100%;height:100%}
.reel{position:absolute;inset:0;display:none}
.reel.active{display:block}
iframe{width:100%;height:100%;border:0;background:#000}
.ui{position:absolute;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:44px;width:100%;text-align:center;font-size:15px;color:#fff;text-shadow:0 1px 3px #000}
.start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.btn{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.btn svg{width:36px;height:36px;fill:#000;margin-left:3px}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div>TAP TO LOAD REELS</div>
</div>

<div class="feed" id="feed"></div>
<div class="ui"><div class="top">For You • Swipe up/down</div></div>

<script>
let videos = [], current = 0;

async function loadReels() {
  const res = await fetch('https://www.tikwm.com/api/feed/list?region=US&count=20');
  const data = await res.json();
  videos = data.data;

  const feed = document.getElementById('feed');
  videos.forEach((v, i) => {
    const div = document.createElement('div');
    div.className = 'reel' + (i === 0? ' active' : '');
    div.innerHTML = `<iframe src="https://www.tiktok.com/embed/v2/${v.video_id}?lang=en&autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    feed.appendChild(div);
  });
}

function show(idx) {
  current = (idx + videos.length) % videos.length;
  document.querySelectorAll('.reel').forEach((r, i) => {
    r.classList.toggle('active', i === current);
  });
}

document.getElementById('start').onclick = async () => {
  document.getElementById('start').style.display = 'none';
  await loadReels();
};

// Swipe and D-pad
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') show(current + 1);
  if (e.key === 'ArrowUp') show(current - 1);
});

let sy = 0;
addEventListener('touchstart', e => sy = e.touches[0].clientY, {passive:true});
addEventListener('touchend', e => {
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dy) > 50) dy > 0? show(current + 1) : show(current - 1);
}, {passive:true});
</script>
<script async src="https://www.tiktok.com/embed.js"></script>
</body>
</html>
