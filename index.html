<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,system-ui;height:100vh;overflow:hidden;touch-action:none}
.reel{position:absolute;inset:0;display:none;background:#000}
.reel.active{display:block}
.reel video{width:100%;height:100%;object-fit:cover}
.ui{position:absolute;inset:0;z-index:10;pointer-events:none}
.top{position:absolute;top:44px;left:0;right:0;display:flex;justify-content:center;gap:18px;font-size:15px}
.tab{color:#888}.tab.active{color:#fff;font-weight:600}
.right{position:absolute;right:12px;bottom:170px;text-align:center}
.count{font-size:12px;margin-top:4px;text-shadow:0 1px 2px #000}
.bottom{position:absolute;left:12px;bottom:110px;right:70px}
.user{font-weight:600;text-shadow:0 1px 3px #000}
.cap{font-size:14px;margin-top:3px;text-shadow:0 1px 3px #000}
.start{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer}
.btn{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.btn svg{width:36px;height:36px;fill:#000;margin-left:3px}
</style>
</head>
<body>
<div class="start" id="start">
  <div class="btn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
  <div>TAP TO START</div>
</div>

<div id="feed"></div>

<div class="ui">
  <div class="top">
    <span class="tab">Explore</span><span class="tab">Local</span><span class="tab">Following</span><span class="tab">Shop</span><span class="tab active">For You</span>
  </div>
  <div class="right">
    <svg width="28" height="28" fill="#fff" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <div class="count" id="likes">-</div>
  </div>
  <div class="bottom">
    <div class="user" id="user">@tiktok</div>
    <div class="cap" id="cap">Loading...</div>
  </div>
</div>

<script>
let vids=[], idx=0, tab=4, loading=false;
const tabs=document.querySelectorAll('.tab');

async function loadBatch(){
  if(loading) return 0; 
  loading=true;
  try{
    // Force US + English only
    const res=await fetch('https://www.tikwm.com/api/feed/list?region=US&count=10&language=en&_='+Date.now());
    const data=await res.json();
    const feed=document.getElementById('feed');
    let added=0;

    for(const v of data.data){
      // Skip duplicates + non-US
      if(vids.find(x=>x.video_id===v.video_id)) continue;
      if(v.region&&v.region!=='US') continue;

      vids.push(v);
      const reel=document.createElement('div');
      reel.className='reel';

      const video=document.createElement('video');
      video.playsInline=true;
      video.preload='none';
      video.muted=true; // start muted, unmute on play

      // Skip broken videos automatically
      video.addEventListener('error',()=>{
        if(reel.classList.contains('active')) show(idx+1);
      });
      video.addEventListener('ended',()=>{ video.currentTime=0; video.play().catch(()=>{}); });

      reel.appendChild(video);
      feed.appendChild(reel);
      added++;
    }
    loading=false;
    return added;
  }catch(e){
    loading=false;
    return 0;
  }
}

async function show(i){
  // FIX: Load more instead of looping
  if(i>=vids.length){
    await loadBatch();
    if(i>=vids.length) i=vids.length-1; // stay on last if nothing loaded
  }
  if(i<0) i=0;
  idx=i;

  const reels=document.querySelectorAll('.reel');
  reels.forEach((r,n)=>{
    const isActive=n===idx;
    r.classList.toggle('active',isActive);
    const vid=r.querySelector('video');

    if(isActive){
      if(!vid.src) vid.src=vids[n].play;
      vid.muted=false;
      vid.volume=1;
      vid.play().catch(()=>setTimeout(()=>show(idx+1),1000));
      document.getElementById('user').textContent='@'+vids[n].author.unique_id;
      document.getElementById('cap').textContent=vids[n].title||'';
      document.getElementById('likes').textContent=format(vids[n].digg_count);
      // Preload next
      if(n+1<vids.length) reels[n+1]?.querySelector('video').load();
      if(n>=vids.length-2) loadBatch();
    }else{
      vid.pause();
      vid.removeAttribute('src');
    }
  });
}

function format(n){return n>1e6?(n/1e6).toFixed(1)+'M':n>1e3?(n/1e3).toFixed(1)+'K':n}
function changeTab(d){tab=(tab+d+5)%5;tabs.forEach((t,i)=>t.classList.toggle('active',i===tab));}

document.getElementById('start').onclick=async()=>{
  document.getElementById('start').style.display='none';
  await loadBatch();
  await show(0);
};

// SWIPES - no loop back
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40) changeTab(dx<0?1:-1);
  else if(Math.abs(dy)>40) dy<-40?show(idx-1):show(idx+1);
},{passive:true});

addEventListener('keydown',e=>{
  if(e.key==='ArrowDown')show(idx+1);
  if(e.key==='ArrowUp')show(idx-1);
});
</script>
</body>
</html>
