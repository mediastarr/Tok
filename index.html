<script>
let vids=[], idx=0, tab=4, loading=false;
const tabs=document.querySelectorAll('.tab');

async function loadBatch(){
  if(loading) return; loading=true;
  try{
    // Force US region + English only
    const res=await fetch('https://www.tikwm.com/api/feed/list?region=US&count=10&language=en&_='+Date.now());
    const data=await res.json();
    const container=document.getElementById('feed');

    for(const v of data.data){
      // Skip if not US or already exists
      if(v.region!=='US' && v.author?.region!=='US') continue;
      if(vids.find(x=>x.video_id===v.video_id)) continue;

      vids.push(v);
      const reel=document.createElement('div');
      reel.className='reel';
      reel.dataset.index=vids.length-1;

      const video=document.createElement('video');
      video.playsInline=true;
      video.preload='none'; // lazy load
      video.style.cssText='width:100%;height:100%;object-fit:cover;background:#000';

      // Auto-skip broken videos
      video.addEventListener('error',()=>{
        console.log('Broken video, skipping');
        if(reel.classList.contains('active')) show(idx+1);
      });
      video.addEventListener('ended',()=>{ video.currentTime=0; video.play().catch(()=>{}); });
      video.addEventListener('stalled',()=>video.load());

      reel.appendChild(video);
      container.appendChild(reel);
    }
  }catch(e){console.log('Load failed',e)}
  loading=false;
}

async function show(i){
  // FIX: Don't loop back, load more instead
  if(i>=vids.length){
    await loadBatch();
    // If still no new videos, stay on last one
    if(i>=vids.length) i=vids.length-1;
  }
  if(i<0) i=0;

  idx=i;
  const reels=document.querySelectorAll('.reel');

  // Create reel if missing
  if(!reels[idx]) await loadBatch();

  document.querySelectorAll('.reel').forEach((r,n)=>{
    const isActive=n===idx;
    r.classList.toggle('active',isActive);
    const vid=r.querySelector('video');

    if(isActive){
      // Lazy load + play with sound
      if(!vid.src) vid.src=vids[n].play;
      vid.muted=false;
      vid.volume=1;
      vid.play().catch(()=>{
        // If autoplay blocked, show next
        setTimeout(()=>show(idx+1),500);
      });
      document.getElementById('user').textContent='@'+vids[n].author.unique_id;
      document.getElementById('cap').textContent=vids[n].title||'';

      // Preload next 2
      if(n+1<vids.length) document.querySelectorAll('.reel')[n+1]?.querySelector('video').load();
      if(n+2<vids.length) document.querySelectorAll('.reel')[n+2]?.querySelector('video').load();
      // Auto-load more when 2 from end
      if(n>=vids.length-2) loadBatch();
    }else{
      vid.pause();
      vid.removeAttribute('src');
      vid.load();
    }
  });
}

function changeTab(d){tab=(tab+d+5)%5;tabs.forEach((t,i)=>t.classList.toggle('active',i===tab));}

document.getElementById('start').onclick=async()=>{
  document.getElementById('start').style.display='none';
  await loadBatch();
  await show(0);
  const firstVid=document.querySelector('.reel.active video');
  if(firstVid){
    firstVid.muted=false;
    try{await firstVid.play()}catch{}
  }
};

// SWIPES - no loop back
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>40) changeTab(dx<0?1:-1);
  else if(Math.abs(dy)>40) dy<-40?show(idx-1):show(idx+1);
},{passive:true});

addEventListener('keydown',e=>{
  if(e.key==='ArrowDown')show(idx+1);
  if(e.key==='ArrowUp')show(idx-1);
});
</script>
