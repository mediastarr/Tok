<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TikTok</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{color:#fff;font-family:-apple-system,system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}

.stage{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;
}

.card{
  height:82vh;aspect-ratio:9/16;border-radius:14px;
  overflow:hidden;position:relative;transition:height .2s ease;
  flex-shrink:0;background:#000;cursor:pointer;
  pointer-events:none;
}
body.ready .card{pointer-events:auto}
body.menu-active .card{height:48vh}

/* ===== FEED ===== */
#feed{
  position:absolute;inset:0;
  transition:transform .32s cubic-bezier(.4,0,.2,1);
}
#feed.swiping{transition:none}
.reel{position:absolute;left:0;width:100%;height:100%;background:#000}
.reel video{width:100%;height:100%;object-fit:cover}

/* ===== VIDEO INFO ===== */
.vid-info{
  position:absolute;left:0;right:0;bottom:0;
  padding:48px 12px 14px;
  background:linear-gradient(transparent,rgba(0,0,0,.7));
  pointer-events:none;z-index:3;
  transition:opacity .2s;
}
body.menu-active .vid-info{opacity:0}
.vid-info-user{font-size:13px;font-weight:700;margin-bottom:3px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vid-info-cap{font-size:12px;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-info-stats{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px;display:flex;gap:10px}

/* ===== PLAY OVERLAY ===== */
.play-overlay{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3);pointer-events:none;z-index:5;
}
body.menu-active .play-overlay{display:flex}
.play-circle{
  width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.5);
  border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;
}
.play-circle svg{width:20px;height:20px;fill:rgba(255,255,255,.9);margin-left:2px}

/* ===== MENU INFO ===== */
.menu-info{display:none;flex-direction:column;align-items:flex-start;width:auto;max-width:80%;padding:0 4px}
body.menu-active .menu-info{display:flex}
.menu-user-row{font-size:13px;font-weight:600;display:flex;align-items:center;gap:5px}
.menu-avatar{width:22px;height:22px;border-radius:50%;background:#444;border:1px solid #666;overflow:hidden}
.menu-cap{font-size:12px;color:#ccc;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-stats{font-size:11px;color:#aaa;margin-top:4px;display:flex;gap:12px}

/* ===== ACTION BAR ===== */
.menu-actions{display:none;gap:18px;padding:10px 24px;background:rgba(50,50,50,.8);border-radius:40px}
body.menu-active .menu-actions{display:flex}
.action-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.action-btn svg{width:24px;height:24px;fill:#fff;opacity:.85}
.action-btn.liked svg{fill:#fe2c55;opacity:1}
.action-btn.saved svg{fill:#ffe135;opacity:1}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(60,60,60,.85);color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200}
.toast.show{opacity:1}

/* ===== LOADER ===== */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.4);z-index:4;pointer-events:none;opacity:0;transition:opacity .2s}
.loader.show{opacity:1}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== SPLASH ===== */
.splash{
  position:fixed;inset:0;z-index:999;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;gap:16px;
}
.splash-icon{width:72px;height:72px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-size:28px}
.splash-text{color:#fff;font-size:15px;letter-spacing:.05em}
/* ===== PROFILE OVERLAY ===== */
.profile-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,.92);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:24px;
  touch-action:none;
}
.profile-overlay.open{display:flex}

.profile-videos{
  width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;
  margin-top:8px;max-height:35vh;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}

.profile-vid-thumb{
  aspect-ratio:9/16;background:#222;border-radius:4px;overflow:hidden;
  cursor:pointer;
}
.profile-vid-thumb img{width:100%;height:100%;object-fit:cover}

.profile-close{
  margin-top:10px;font-size:13px;color:#ccc;cursor:pointer;
  padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.08);
}

/* ===== MORE SHEET ===== */
.more-sheet{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);
  width:90%;max-width:360px;
  background:#1a1a1a;border-radius:18px 18px 0 0;
  z-index:400;padding:12px 0 24px;
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.more-sheet.open{transform:translateX(-50%) translateY(0)}
.more-backdrop{
  position:fixed;inset:0;z-index:399;
  background:rgba(0,0,0,.5);display:none;
}
.more-backdrop.open{display:block}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="splash-icon">▶</div>
  <div class="splash-text">Tap to Start</div>
</div>

<div class="stage">
  <div class="card" id="card">
    <div id="feed"></div>
    <div class="vid-info" id="vidInfo">
      <div class="vid-info-user" id="vidUser"></div>
      <div class="vid-info-cap" id="vidCap"></div>
      <div class="vid-info-stats" id="vidStats"></div>
    </div>
    <div class="play-overlay">
      <div class="play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
    </div>
    <div class="loader" id="loader"><div class="spin"></div></div>
  </div>

  <div class="menu-info" id="menuInfo">
    <div class="menu-user-row">
      <div class="menu-avatar" id="menuAvatar"></div>
      <span id="menuUser">@user</span>
    </div>
    <div class="menu-cap" id="menuCap"></div>
    <div class="menu-stats" id="menuStats"></div>
  </div>

  <div class="menu-actions" id="menuActions">
    <div class="action-btn" id="btnLike"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></div>
    <div class="action-btn" id="btnShare"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></div>
    <div class="action-btn" id="btnSave"><svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></div>
    <div class="action-btn" id="btnMore"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="profile-overlay" id="profileOverlay">
  <div class="profile-av" id="profileAv"><div class="profile-av-placeholder">👤</div></div>
  <div class="profile-name" id="profileName"></div>
  <div class="profile-handle" id="profileHandle"></div>
  <div class="profile-stats" id="profileStats"></div>
  <div class="profile-videos" id="profileVideos"></div>
  <div class="profile-close" id="profileClose">Close</div>
</div>

<div class="more-backdrop" id="moreBackdrop"></div>
<div class="more-sheet" id="moreSheet">
  <div class="more-sheet-handle"></div>
  <div class="more-row" id="moreProfile">View Creator Profile</div>
  <div class="more-row" id="moreNext">Skip to Next Video</div>
  <div class="more-row" id="moreCopyLink">Copy Link</div>
  <div class="more-row" id="moreNotInterested">Not Interested</div>
  <div class="more-sheet-cancel" id="moreCancel">Cancel</div>
</div>
<script>
let vids=[],idx=0,loading=false,menuOpen=false;
const seenIds=new Set(),likedIds=new Set(),savedIds=new Set();
let loadPending=false,userTouched=false;
let lastProfileTap=0;
let profileOpen=false;

const card=document.getElementById('card');
const feed=document.getElementById('feed');
const profileOverlay=document.getElementById('profileOverlay');
const profileVideos=document.getElementById('profileVideos');

/* BLOCK POINTER EVENTS INSIDE PROFILE OVERLAY */
['pointerdown','pointermove','pointerup'].forEach(ev=>{
  profileOverlay.addEventListener(ev,e=>e.stopPropagation(),{passive:false});
  profileVideos.addEventListener(ev,e=>e.stopPropagation(),{passive:false});
});

/* ===== TOAST ===== */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

/* ===== MENU ===== */
function openMenu(){
  if(menuOpen) return;
  menuOpen=true;
  document.body.classList.add('menu-active');
}
function closeMenu(){
  if(!menuOpen) return;
  menuOpen=false;
  document.body.classList.remove('menu-active');
}

/* ===== PROFILE ===== */
async function openProfile(){
  profileOpen=true;
  profileOverlay.classList.add('open');

  const d=vids[idx];
  document.getElementById('profileName').textContent=d.author?.nickname||d.author?.unique_id;
  document.getElementById('profileHandle').textContent='@'+d.author?.unique_id;

  const thumbs=document.getElementById('profileVideos');
  thumbs.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:20px;color:#666">Loading…</div>';

  const res=await fetch('https://www.tikwm.com/api/user/posts?unique_id='+d.author.unique_id+'&count=9');
  const data=await res.json();
  const vidsList=data?.data?.videos||[];

  thumbs.innerHTML='';
  vidsList.slice(0,9).forEach(v=>{
    const el=document.createElement('div');
    el.className='profile-vid-thumb';
    el.innerHTML='<img src="'+v.cover+'">';
    el.addEventListener('pointerup',()=>{
      playProfileVid(v.play,v.video_id);
    });
    thumbs.appendChild(el);
  });
}

function closeProfile(){
  profileOpen=false;
  profileOverlay.classList.remove('open');
}

document.getElementById('profileClose').addEventListener('pointerup',closeProfile);

/* ===== PLAY PROFILE VIDEO ===== */
function playProfileVid(url,id){
  closeProfile();
  const existing=vids.findIndex(v=>v.aweme_id===id);
  if(existing!==-1){ show(existing,true,1); return; }

  const d=vids[idx];
  vids.splice(idx+1,0,{
    aweme_id:id,
    videoUrl:url,
    title:'',
    author:d.author,
    digg_count:0,share_count:0,comment_count:0,
    duration:60,region:'US'
  });

  const reel=document.createElement('div');
  reel.className='reel';
  const video=document.createElement('video');
  video.src=url;
  video.playsInline=true;
  video.muted=true;
  reel.appendChild(video);
  feed.appendChild(reel);

  feed.querySelectorAll('.reel').forEach((r,n)=>r.style.top=n*100+'%');

  show(idx+1,true,1);
}
/* ===== FEED LOADING ===== */
async function loadBatch(){
  const res=await fetch('https://www.tikwm.com/api/feed/list?region=US&count=20');
  const data=await res.json();
  const items=data.data||[];

  items.forEach(v=>{
    if(seenIds.has(v.video_id)) return;
    seenIds.add(v.video_id);

    vids.push({
      aweme_id:v.video_id,
      videoUrl:v.play,
      title:v.title,
      author:{unique_id:v.author.unique_id,avatar:v.author.avatar},
      digg_count:v.digg_count,
      share_count:v.share_count,
      comment_count:v.comment_count,
      duration:v.duration,
      region:v.region
    });

    const reel=document.createElement('div');
    reel.className='reel';
    reel.style.top=(vids.length-1)*100+'%';

    const video=document.createElement('video');
    video.playsInline=true;
    video.muted=true;
    reel.appendChild(video);

    feed.appendChild(reel);
  });
}

function preloadAhead(){
  const reels=document.querySelectorAll('.reel');
  for(let o=1;o<=2;o++){
    const ni=idx+o;
    if(ni<vids.length){
      const v=reels[ni].querySelector('video');
      if(!v.src){
        v.src=vids[ni].videoUrl;
        v.preload='auto';
      }
    }
  }
}
async function show(i,animate=false,dir=1){
  if(i>=vids.length){ await loadBatch(); }
  if(i<0)i=0;
  idx=i;

  const reels=document.querySelectorAll('.reel');

  if(animate){
    feed.classList.add('swiping');
    feed.style.transform='translateY('+(-(idx-dir)*100)+'%)';
    requestAnimationFrame(()=>{
      feed.classList.remove('swiping');
      feed.style.transform='translateY('+(-(idx*100))+'%)';
    });
  }else{
    feed.style.transform='translateY('+(-(idx*100))+'%)';
  }

  /* ===== CONTINUE SHOW() ===== */
  reels.forEach((r,n)=>{
    const isActive = (n === idx);
    r.classList.toggle('active', isActive);

    const vid = r.querySelector('video');

    if(isActive){
      loader.classList.add('show');

      if(!vid.src){
        vid.src = vids[n].videoUrl;
        vid.preload = 'auto';
      }

      vid.muted = false;
      vid.volume = 1;

      const tryPlay = () => {
        vid.play().catch(()=>{
          vid.muted = true;
          vid.play().catch(()=>{});
        });
      };

      if(vid.readyState >= 2){
        tryPlay();
      } else {
        const h = () => {
          vid.removeEventListener('canplay', h);
          tryPlay();
        };
        vid.addEventListener('canplay', h);
        vid.load();
      }

      updateOverlay(vids[n]);
      preloadAhead();

      if(n >= vids.length - 3){
        loadBatch();
      }

    } else {
      vid.pause();
      if(Math.abs(n - idx) > 6){
        vid.removeAttribute('src');
        vid.load();
      }
    }
  });
}

/* ===== SPLASH ===== */
document.getElementById('splash').addEventListener('pointerup', async () => {
  userTouched = true;
  document.getElementById('splash').style.display = 'none';
  document.body.classList.add('ready');
  loader.classList.add('show');

  await loadBatch();
  await show(0);

  const v = document.querySelector('.reel.active video');
  if(v){
    v.muted = false;
    v.volume = 1;
  }
}, { once:true });

/* ===== POINTER SWIPE ENGINE ===== */
let sx = 0, sy = 0;

function onPointerDown(e){
  if(profileOpen) return;
  sx = e.clientX;
  sy = e.clientY;
}

function onPointerUp(e){
  if(profileOpen) return;
  if(Date.now() - lastProfileTap < 300) return;

  const dx = e.clientX - sx;
  const dy = e.clientY - sy;

  const isSwipe = Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx) * 0.7;

  if(menuOpen){
    if(isSwipe) closeMenu();
    return;
  }

  if(isSwipe){
    if(dy > 40) show(idx + 1, true, 1);
    else show(idx - 1, true, -1);
  }
}

window.addEventListener('pointerdown', onPointerDown, { passive:true });
window.addEventListener('pointerup', onPointerUp, { passive:true });

/* ===== KEYBOARD ===== */
window.addEventListener('keydown', e => {
  if(menuOpen){
    if(e.key === 'Escape' || e.key === 'ArrowUp'){
      closeMenu();
      return;
    }
  }

  if(e.key === 'ArrowDown') show(idx + 1, true, 1);
  if(e.key === 'ArrowUp') show(idx - 1, true, -1);
});
</script>
</body>
</html>
